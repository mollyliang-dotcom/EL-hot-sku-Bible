name: Sync Category Trend Content

on:
  schedule:
    - cron: '15 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-category-trend-content
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl pillow

      - name: Download latest Google Sheet as XLSX
        run: |
          curl -L --fail --retry 3 --retry-delay 5 \
            "https://docs.google.com/spreadsheets/d/19lDqIMFevcPr7QwYKuopEB1H-uQWK3s3NDKYQybwPfg/export?format=xlsx" \
            -o category_source.xlsx

          test -s category_source.xlsx

      - name: Extract text and floating images to staging
        run: |
          python extract_category_content.py \
            --xlsx category_source.xlsx \
            --sheet category \
            --out-dir .category_sync_tmp

      - name: Validate staged output
        run: |
          python - << 'PY'
          import json
          from pathlib import Path

          p = Path(".category_sync_tmp/category_content.json")
          if not p.exists():
              raise SystemExit("category_content.json was not generated")

          data = json.loads(p.read_text(encoding="utf-8"))
          blocks = data.get("blocks")
          stats = data.get("stats", {})

          if not isinstance(blocks, list):
              raise SystemExit("blocks is not a list")

          if not blocks and stats.get("images_extracted", 0) == 0:
              raise SystemExit("staged content is unexpectedly empty")

          print(
              "Validated:",
              len(blocks), "text blocks,",
              stats.get("images_extracted", 0), "images"
          )
          PY

      - name: Publish staged output atomically
        run: |
          rm -rf category_assets.new
          mv .category_sync_tmp/category_assets category_assets.new

          cp .category_sync_tmp/category_content.json category_content.json

          rm -rf category_assets
          mv category_assets.new category_assets

          rm -rf .category_sync_tmp
          rm -f category_source.xlsx

      - name: Commit and push changes
        run: |
          git config user.name "actions-user"
          git config user.email "actions@github.com"

          git add category_content.json category_assets/

          if git diff --staged --quiet; then
            echo "No category content changes."
            exit 0
          fi

          git commit -m "Auto sync category trend content"
          git push
