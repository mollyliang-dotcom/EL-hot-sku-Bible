
name: Sync Sheet Data

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch CSV and convert to JSON
        run: |
          python3 << 'EOF'
          import csv, json, urllib.request, io

          def fetch_json(url, label):
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
                  with urllib.request.urlopen(req, timeout=30) as r:
                      if r.status != 200:
                          raise Exception(f"HTTP {r.status}")
                      content = r.read().decode('utf-8-sig')
              except Exception as e:
                  print(f"❌ {label} 请求失败: {e}")
                  raise

              reader = csv.DictReader(
                  io.StringIO(content),
                  quoting=csv.QUOTE_ALL
              )
              rows = list(reader)
              print(f"✅ {label}: {len(rows)} rows")
              return rows

          # ── CB Tab ──────────────────────────────────────────────────
          cb_url = "https://docs.google.com/spreadsheets/d/e/2PACX-1vT2Z61Z0LxqcTmhjJe5KS_PimpDY4bM-aODeY0CuL9z3EX233KOqWMkXWJteyXQkexOMSqIO3O3rMI-/pub?gid=990111578&single=true&output=csv"
          cb_rows = fetch_json(cb_url, "CB")
          with open("data_cb.json", "w", encoding="utf-8") as f:
              json.dump(cb_rows, f, ensure_ascii=False)

          # ── CNLS Tab ─────────────────────────────────────────────────
          cnls_url = "https://docs.google.com/spreadsheets/d/e/2PACX-1vT2Z61Z0LxqcTmhjJe5KS_PimpDY4bM-aODeY0CuL9z3EX233KOqWMkXWJteyXQkexOMSqIO3O3rMI-/pub?gid=1366116887&single=true&output=csv"
          cnls_rows = fetch_json(cnls_url, "CNLS")
          with open("data_cnls.json", "w", encoding="utf-8") as f:
              json.dump(cnls_rows, f, ensure_ascii=False)

          EOF

      - name: Commit and push
        run: |
          git config user.name "actions-user"
          git config user.email "actions@github.com"
          git add data_cb.json data_cnls.json
          git diff --staged --quiet || git commit -m "Auto sync data"
          git push
