name: Sync Sheet Data

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Fetch CSV and convert to JSON
        run: |
          python3 << 'EOF'
          import csv
          import io
          import json
          import urllib.request

          def fetch_csv(url, label):
              try:
                  req = urllib.request.Request(
                      url,
                      headers={"User-Agent": "Mozilla/5.0"}
                  )
                  with urllib.request.urlopen(req, timeout=60) as r:
                      if r.status != 200:
                          raise Exception(f"HTTP {r.status}")
                      content = r.read().decode("utf-8-sig")
              except Exception as e:
                  print(f"ERROR {label}: {e}")
                  raise

              rows = list(csv.reader(io.StringIO(content)))
              print(f"OK {label}: {max(len(rows)-1, 0)} rows")
              return rows

          def fetch_dict(url, label):
              rows = fetch_csv(url, label)
              if not rows:
                  return []
              header = rows[0]
              result = []
              for row in rows[1:]:
                  if len(row) < len(header):
                      row += [""] * (len(header) - len(row))
                  result.append(dict(zip(header, row)))
              return result

          def clean_num(v):
              s = str(v or "").strip().replace(",", "").replace("$", "")
              if not s or s in {"-", "—"}:
                  return 0.0
              try:
                  return float(s)
              except Exception:
                  return 0.0

          def clean_pct(v):
              s = str(v or "").strip().replace(",", "")
              if not s or s in {"-", "—"}:
                  return 0.0
              try:
                  if s.endswith("%"):
                      return float(s[:-1])
                  # Raw growth fields in this sheet are stored as ratios.
                  return float(s) * 100
              except Exception:
                  return 0.0

          def cell(row, idx):
              return row[idx].strip() if idx < len(row) and row[idx] is not None else ""

          def item_id_from_link(link):
              link = str(link or "").strip().rstrip("/")
              return link.split("/")[-1] if link else ""

          def dedupe_products(items):
              out = {}
              for x in items:
                  key = (x["site"], x["itemid"] or x["link"])
                  if not key[1]:
                      continue
                  prev = out.get(key)
                  if prev is None or x["adg"] > prev["adg"]:
                      out[key] = x
              return list(out.values())

          # ============================================================
          # Existing Hot SKU data
          # ============================================================

          cb_url = "https://docs.google.com/spreadsheets/d/e/2PACX-1vT2Z61Z0LxqcTmhjJe5KS_PimpDY4bM-aODeY0CuL9z3EX233KOqWMkXWJteyXQkexOMSqIO3O3rMI-/pub?gid=990111578&single=true&output=csv"
          cb_rows = fetch_dict(cb_url, "CB")

          with open("data_cb.json", "w", encoding="utf-8") as f:
              json.dump(cb_rows, f, ensure_ascii=False)

          cnls_url = "https://docs.google.com/spreadsheets/d/e/2PACX-1vT2Z61Z0LxqcTmhjJe5KS_PimpDY4bM-aODeY0CuL9z3EX233KOqWMkXWJteyXQkexOMSqIO3O3rMI-/pub?gid=1366116887&single=true&output=csv"
          cnls_rows = fetch_dict(cnls_url, "CNLS")

          with open("data_cnls.json", "w", encoding="utf-8") as f:
              json.dump(cnls_rows, f, ensure_ascii=False)

          # ============================================================
          # Phone Case page
          # Source tab: EL HOT ITEM
          # gid = 759893186
          # CB products: A:R
          # CNLS products: U:AM
          # Keywords: AP:AX
          # ============================================================

          item_url = "https://docs.google.com/spreadsheets/d/e/2PACX-1vT2Z61Z0LxqcTmhjJe5KS_PimpDY4bM-aODeY0CuL9z3EX233KOqWMkXWJteyXQkexOMSqIO3O3rMI-/pub?gid=759893186&single=true&output=csv"
          item_rows = fetch_csv(item_url, "PHONE_CASE")

          TARGET_L4 = "Phone Cases, Covers, & Skins"

          cb_products = []
          cnls_products = []
          keywords = []

          # Column indexes, 0-based:
          # CB A:R
          # C site / E price / F ADO / I ADO MoM / J ADG / M ADG MoM
          # O link / P image / Q L3 / R L4
          #
          # CNLS U:AM
          # W site / Y price / Z ADO / AC ADO MoM / AD ADG / AG ADG MoM
          # AI link / AJ image / AK L3 / AL L4
          #
          # Keywords AP:AX
          # AQ site / AT keyword / AV item click / AX click growth

          for row in item_rows[1:]:

              # ---------------- CB products ----------------
              cb_l4 = cell(row, 17)  # R
              if cb_l4 == TARGET_L4:
                  link = cell(row, 14)  # O
                  cb_products.append({
                      "site": cell(row, 2),          # C
                      "price": clean_num(cell(row, 4)),      # E
                      "ado": clean_num(cell(row, 5)),        # F
                      "ado_mom": clean_pct(cell(row, 8)),    # I
                      "adg": clean_num(cell(row, 9)),        # J
                      "adg_mom": clean_pct(cell(row, 12)),   # M
                      "link": link,
                      "image": cell(row, 15),        # P
                      "l3": cell(row, 16),           # Q
                      "l4": cb_l4,
                      "itemid": item_id_from_link(link),
                  })

              # ---------------- CNLS products ----------------
              cn_l4 = cell(row, 37)  # AL
              if cn_l4 == TARGET_L4:
                  link = cell(row, 34)  # AI
                  cnls_products.append({
                      "site": cell(row, 22),         # W
                      "price": clean_num(cell(row, 24)),     # Y
                      "ado": clean_num(cell(row, 25)),       # Z
                      "ado_mom": clean_pct(cell(row, 28)),   # AC
                      "adg": clean_num(cell(row, 29)),       # AD
                      "adg_mom": clean_pct(cell(row, 32)),   # AG
                      "link": link,
                      "image": cell(row, 35),        # AJ
                      "l3": cell(row, 36),           # AK
                      "l4": cn_l4,
                      "itemid": item_id_from_link(link),
                  })

              # ---------------- Keywords ----------------
              keyword = cell(row, 45)  # AT
              site = cell(row, 42)     # AQ

              if keyword and site:
                  keywords.append({
                      "site": site,
                      "keyword": keyword,
                      "clicks": clean_num(cell(row, 47)),    # AV
                      "growth": clean_pct(cell(row, 49)),    # AX
                  })

          cb_products = dedupe_products(cb_products)
          cnls_products = dedupe_products(cnls_products)

          # De-duplicate keyword rows by site + keyword.
          # If duplicated, keep the row with the highest Item Click.
          kw_map = {}
          for x in keywords:
              key = (x["site"], x["keyword"].strip().lower())
              prev = kw_map.get(key)
              if prev is None or x["clicks"] > prev["clicks"]:
                  kw_map[key] = x
          keywords = list(kw_map.values())

          # Chinese translations for the current common keyword pool.
          # Unknown/new keywords fall back to the original keyword so
          # automatic synchronization never breaks.
          zh_map = {
              "power bank": "充电宝",
              "powerbank": "充电宝",
              "phone case": "手机壳",
              "iphone case": "iPhone 手机壳",
              "case iphone": "iPhone 手机壳",
              "casing iphone": "iPhone 手机壳",
              "iphone 13 case": "iPhone 13 手机壳",
              "iphone 17 case": "iPhone 17 手机壳",
              "iphone 17 pro case": "iPhone 17 Pro 手机壳",
              "iphone 17 pro max case": "iPhone 17 Pro Max 手机壳",
              "iphone 17 pro max casing": "iPhone 17 Pro Max 手机壳",
              "casing iphone 17 pro max": "iPhone 17 Pro Max 手机壳",
              "ipad case": "iPad 保护壳",
              "fold 8 case": "Fold 8 手机壳",
              "z fold 8 case": "Z Fold 8 手机壳",
              "phone strap": "手机挂绳",
              "portable charger": "便携式充电器",
              "portable fan": "便携风扇",
              "charger type c": "Type-C 充电器",
              "iphone charger": "iPhone 充电器",
              "sd card": "SD 卡",
              "capinha": "手机壳",
              "capinha iphone 14": "iPhone 14 手机壳",
              "capinha iphone 17": "iPhone 17 手机壳",
              "capinha iphone 17 pro max": "iPhone 17 Pro Max 手机壳",
              "suporte para celular": "手机支架",
              "tripé para celular": "手机三脚架",
              "carregador portátil": "便携式充电宝",
              "carregador portátil para celular": "便携式手机充电宝",
              "carregador portátil 20000mah": "20000mAh 便携式充电宝",
              "funda poco x8 pro": "POCO X8 Pro 手机壳",
              "funda iphone 15 pro max": "iPhone 15 Pro Max 手机壳",
              "เคส": "手机壳",
              "เคสไอโฟน": "iPhone 手机壳",
              "เคสไอโฟน 13": "iPhone 13 手机壳",
              "เคสไอโฟน 17 pro max": "iPhone 17 Pro Max 手机壳",
              "พาวเวอร์แบงค์": "充电宝",
              "สายชาร์จไอโฟน": "iPhone 充电线",
              "สายชาร์จ type c": "Type-C 充电线",
              "สายคล้องโทรศัพท์": "手机挂绳",
              "手機殼": "手机壳",
              "手機掛繩": "手机挂绳",
              "充電線": "充电线",
              "手機支架": "手机支架",
              "ipad 保護殼": "iPad 保护壳",
              "airpods 4保護殼": "AirPods 4 保护壳",
              "iphone 17 手機殼": "iPhone 17 手机壳",
              "iphone 17 pro 手機殼": "iPhone 17 Pro 手机壳",
              "磁吸手機殼": "磁吸手机壳",
              "ốp": "手机壳",
              "ốp lưng": "手机壳",
              "ốp lưng iphone": "iPhone 手机壳",
              "ốp iphone 17 pro max": "iPhone 17 Pro Max 手机壳",
              "sạc dự phòng": "充电宝",
              "quạt cầm tay": "手持风扇",
              "dây sạc iphone": "iPhone 充电线",
              "giá đỡ điện thoại": "手机支架",
              "kính cường lực iphone": "iPhone 钢化膜",
              "cường lực iphone": "iPhone 钢化膜",
          }

          for x in keywords:
              key = x["keyword"].strip().lower()
              x["zh"] = zh_map.get(key, x["keyword"])

          phonecase_data = {
              "category": TARGET_L4,
              "cb": cb_products,
              "cnls": cnls_products,
              "keywords": keywords,
          }

          with open("phonecase_data.json", "w", encoding="utf-8") as f:
              json.dump(phonecase_data, f, ensure_ascii=False)

          print(
              "OK PHONE_CASE:",
              len(cb_products), "CB items,",
              len(cnls_products), "CNLS items,",
              len(keywords), "keywords"
          )

          EOF

      - name: Commit and push
        run: |
          git config user.name "actions-user"
          git config user.email "actions@github.com"

          git add data_cb.json data_cnls.json phonecase_data.json

          if git diff --staged --quiet; then
            echo "No data changes."
            exit 0
          fi

          git commit -m "Auto sync data"
          git push
