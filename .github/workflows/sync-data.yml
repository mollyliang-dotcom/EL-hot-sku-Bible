name: Sync Sheet Data

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Fetch CSV and convert to compressed JSON
        run: |
          python3 << 'EOF'
          import csv, json, urllib.request

          url = "https://docs.google.com/spreadsheets/d/e/2PACX-1vT2Z61Z0LxqcTmhjJe5KS_PimpDY4bM-aODeY0CuL9z3EX233KOqWMkXWJteyXQkexOMSqIO3O3rMI-/pub?gid=759893186&single=true&output=csv"

          with urllib.request.urlopen(url) as r:
              content = r.read().decode('utf-8')

          rows = list(csv.DictReader(content.splitlines()))

          # 字段名压缩映射（a~m 对应原字段，大幅减少文件体积）
          # a = item_id
          # b = year_month
          # c = grass_region
          # d = item_name
          # e = cb_level1_global_be_category
          # f = level2_global_be_category
          # g = level3_global_be_category
          # h = item_create_date
          # i = product_image
          # j = price_usd
          # k = ADO(SUM)
          # l = mom_ado_growth_contri(SUM)
          # m = ADG_usd(SUM)

          def compress(row):
              return {
                  "a": row.get("item_id", ""),
                  "b": row.get("year_month", ""),
                  "c": row.get("grass_region", ""),
                  "d": row.get("item_name", ""),
                  "e": row.get("cb_level1_global_be_category", ""),
                  "f": row.get("level2_global_be_category", ""),
                  "g": row.get("level3_global_be_category", ""),
                  "h": row.get("item_create_date", ""),
                  "i": row.get("product_image", ""),
                  "j": row.get("price_usd", ""),
                  "k": row.get("ADO(SUM)", ""),
                  "l": row.get("mom_ado_growth_contri(SUM)", ""),
                  "m": row.get("ADG_usd(SUM)", "")
              }

          compressed = [compress(r) for r in rows]

          with open("data.json", "w", encoding="utf-8") as f:
              json.dump(compressed, f, separators=(',', ':'), ensure_ascii=False)

          print(f"Done: {len(compressed)} rows written to data.json")
          EOF

      - name: Commit and push data.json
        run: |
          git config user.name "actions-user"
          git config user.email "actions@github.com"
          git add data.json
          git diff --staged --quiet || git commit -m "Auto sync data"
          git push
