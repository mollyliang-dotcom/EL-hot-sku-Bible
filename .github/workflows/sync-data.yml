name: Sync Sheet Data

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Fetch CSV and convert to JSON
        run: |
          python3 << 'EOF'
          import csv
          import io
          import json
          import urllib.request

          def fetch_csv(url, label):
              try:
                  req = urllib.request.Request(
                      url,
                      headers={"User-Agent": "Mozilla/5.0"}
                  )
                  with urllib.request.urlopen(req, timeout=60) as r:
                      if r.status != 200:
                          raise Exception(f"HTTP {r.status}")
                      content = r.read().decode("utf-8-sig")
              except Exception as e:
                  print(f"ERROR {label}: {e}")
                  raise

              rows = list(csv.reader(io.StringIO(content)))
              print(f"OK {label}: {max(len(rows)-1, 0)} rows")
              return rows

          def fetch_dict(url, label):
              rows = fetch_csv(url, label)
              if not rows:
                  return []
              header = rows[0]
              result = []
              for row in rows[1:]:
                  if len(row) < len(header):
                      row += [""] * (len(header) - len(row))
                  result.append(dict(zip(header, row)))
              return result

          def clean_num(v):
              s = str(v or "").strip().replace(",", "").replace("$", "")
              if not s or s in {"-", "—"}:
                  return 0.0
              try:
                  return float(s)
              except Exception:
                  return 0.0

          def clean_pct(v):
              s = str(v or "").strip().replace(",", "")
              if not s or s in {"-", "—"}:
                  return 0.0
              try:
                  if s.endswith("%"):
                      return float(s[:-1])
                  # Raw growth fields in this sheet are stored as ratios.
                  return float(s) * 100
              except Exception:
                  return 0.0

          def cell(row, idx):
              return row[idx].strip() if idx < len(row) and row[idx] is not None else ""

          def item_id_from_link(link):
              link = str(link or "").strip().rstrip("/")
              return link.split("/")[-1] if link else ""

          def dedupe_products(items):
              out = {}
              for x in items:
                  key = (x["site"], x["itemid"] or x["link"])
                  if not key[1]:
                      continue
                  prev = out.get(key)
                  if prev is None or x["adg"] > prev["adg"]:
                      out[key] = x
              return list(out.values())

          # ============================================================
          # Existing Hot SKU data
          # ============================================================

          cb_url = "https://docs.google.com/spreadsheets/d/e/2PACX-1vT2Z61Z0LxqcTmhjJe5KS_PimpDY4bM-aODeY0CuL9z3EX233KOqWMkXWJteyXQkexOMSqIO3O3rMI-/pub?gid=990111578&single=true&output=csv"
          cb_rows = fetch_dict(cb_url, "CB")

          with open("data_cb.json", "w", encoding="utf-8") as f:
              json.dump(cb_rows, f, ensure_ascii=False)

          cnls_url = "https://docs.google.com/spreadsheets/d/e/2PACX-1vT2Z61Z0LxqcTmhjJe5KS_PimpDY4bM-aODeY0CuL9z3EX233KOqWMkXWJteyXQkexOMSqIO3O3rMI-/pub?gid=1366116887&single=true&output=csv"
          cnls_rows = fetch_dict(cnls_url, "CNLS")

          with open("data_cnls.json", "w", encoding="utf-8") as f:
              json.dump(cnls_rows, f, ensure_ascii=False)

          # ============================================================
          # Phone Case page
          # Source tab: 手机壳飙升词
          # gid = 1028592925
          # CB products: A:R
          # CNLS products: U:AM
          # Keywords: AP:AY
          # ============================================================

          item_url = "https://docs.google.com/spreadsheets/d/e/2PACX-1vT2Z61Z0LxqcTmhjJe5KS_PimpDY4bM-aODeY0CuL9z3EX233KOqWMkXWJteyXQkexOMSqIO3O3rMI-/pub?gid=1028592925&single=true&output=csv"
          item_rows = fetch_csv(item_url, "PHONE_CASE_手机壳飙升词")

          TARGET_L4 = "Phone Cases, Covers, & Skins"

          cb_products = []
          cnls_products = []
          keywords = []

          # Column indexes, 0-based:
          # CB A:R
          # C site / E price / F ADO / I ADO MoM / J ADG / M ADG MoM
          # O link / P image / Q L3 / R L4
          #
          # CNLS U:AM
          # W site / Y price / Z ADO / AC ADO MoM / AD ADG / AG ADG MoM
          # AI link / AJ image / AK L3 / AL L4
          #
          # Keywords AP:AY
          # AQ site / AS L2 / AT keyword / AV item click / AX click growth / AY Chinese translation / AY Chinese translation

          for row in item_rows[1:]:

              # ---------------- CB products ----------------
              cb_l4 = cell(row, 17)  # R
              if cb_l4 == TARGET_L4:
                  link = cell(row, 14)  # O
                  cb_products.append({
                      "site": cell(row, 2),          # C
                      "price": clean_num(cell(row, 4)),      # E
                      "ado": clean_num(cell(row, 5)),        # F
                      "ado_mom": clean_pct(cell(row, 8)),    # I
                      "adg": clean_num(cell(row, 9)),        # J
                      "adg_mom": clean_pct(cell(row, 12)),   # M
                      "link": link,
                      "image": cell(row, 15),        # P
                      "l3": cell(row, 16),           # Q
                      "l4": cb_l4,
                      "itemid": item_id_from_link(link),
                  })

              # ---------------- CNLS products ----------------
              cn_l4 = cell(row, 37)  # AL
              if cn_l4 == TARGET_L4:
                  link = cell(row, 34)  # AI
                  cnls_products.append({
                      "site": cell(row, 22),         # W
                      "price": clean_num(cell(row, 24)),     # Y
                      "ado": clean_num(cell(row, 25)),       # Z
                      "ado_mom": clean_pct(cell(row, 28)),   # AC
                      "adg": clean_num(cell(row, 29)),       # AD
                      "adg_mom": clean_pct(cell(row, 32)),   # AG
                      "link": link,
                      "image": cell(row, 35),        # AJ
                      "l3": cell(row, 36),           # AK
                      "l4": cn_l4,
                      "itemid": item_id_from_link(link),
                  })

              # ---------------- Keywords ----------------
              keyword = cell(row, 45)      # AT
              site = cell(row, 42)         # AQ
              keyword_l2 = cell(row, 44)   # AS

              # Phone-case keyword scope:
              # L2 = Accessories-Cases, Covers, & Skins
              if (
                  keyword
                  and site
                  and keyword_l2 == "Accessories-Cases, Covers, & Skins"
              ):
                  keywords.append({
                      "site": site,
                      "keyword": keyword,
                      "clicks": clean_num(cell(row, 47)),    # AV
                      "growth": clean_pct(cell(row, 49)),    # AX
                      "zh": cell(row, 50),                   # AY - strict source, no fallback
                  })

          cb_products = dedupe_products(cb_products)
          cnls_products = dedupe_products(cnls_products)

          if not cb_products and not cnls_products:
              raise Exception(
                  "PHONE_CASE 数据为空：请检查手机壳飙升词 tab 的 gid、发布状态及列范围"
              )

          # De-duplicate keyword rows by site + AY Chinese translation.
          # Same translated phone-case model within the same site is treated
          # as the same keyword; different sites are kept separately.
          # If duplicated, keep the row with the highest Item Click.
          kw_map = {}
          for x in keywords:
              zh_key = str(x.get("zh") or "").strip().lower()
              key = (x["site"], zh_key)
              prev = kw_map.get(key)
              if prev is None or x["clicks"] > prev["clicks"]:
                  kw_map[key] = x
          keywords = list(kw_map.values())

          # Strict validation: Chinese translation must come from AY only.
          # Never substitute AT/original keyword into the Chinese column.
          missing_zh = [
              x for x in keywords
              if not str(x.get("zh") or "").strip()
          ]
          if missing_zh:
              sample = ", ".join(x["keyword"] for x in missing_zh[:5])
              raise Exception(
                  f"PHONE_CASE AY中文翻译为空: {len(missing_zh)} rows; sample: {sample}"
              )

          phonecase_data = {
              "category": TARGET_L4,
              "cb": cb_products,
              "cnls": cnls_products,
              "keywords": keywords,
          }

          with open("phonecase_data.json", "w", encoding="utf-8") as f:
              json.dump(phonecase_data, f, ensure_ascii=False)

          print(
              "OK PHONE_CASE:",
              len(cb_products), "CB items,",
              len(cnls_products), "CNLS items,",
              len(keywords), "keywords"
          )

          EOF

      - name: Commit and push
        run: |
          git config user.name "actions-user"
          git config user.email "actions@github.com"

          git add data_cb.json data_cnls.json phonecase_data.json

          if git diff --staged --quiet; then
            echo "No data changes."
            exit 0
          fi

          git commit -m "Auto sync data"
          git push
