name: Sync Sheet Data

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Fetch CSV and convert to JSON
        run: |
          python3 << 'EOF'
          import csv
          import io
          import json
          import urllib.request

          def fetch_csv(url, label):
              try:
                  req = urllib.request.Request(
                      url,
                      headers={"User-Agent": "Mozilla/5.0"}
                  )
                  with urllib.request.urlopen(req, timeout=60) as r:
                      if r.status != 200:
                          raise Exception(f"HTTP {r.status}")
                      content = r.read().decode("utf-8-sig")
              except Exception as e:
                  print(f"ERROR {label}: {e}")
                  raise

              rows = list(csv.reader(io.StringIO(content)))
              print(f"OK {label}: {max(len(rows)-1, 0)} rows")
              return rows

          def fetch_dict(url, label):
              rows = fetch_csv(url, label)
              if not rows:
                  return []
              header = rows[0]
              result = []
              for row in rows[1:]:
                  if len(row) < len(header):
                      row += [""] * (len(header) - len(row))
                  result.append(dict(zip(header, row)))
              return result

          def clean_num(v):
              s = str(v or "").strip().replace(",", "").replace("$", "")
              if not s or s in {"-", "—"}:
                  return 0.0
              try:
                  return float(s)
              except Exception:
                  return 0.0

          def clean_pct(v):
              s = str(v or "").strip().replace(",", "")
              if not s or s in {"-", "—"}:
                  return 0.0
              try:
                  if s.endswith("%"):
                      return float(s[:-1])
                  # Raw growth fields in this sheet are stored as ratios.
                  return float(s) * 100
              except Exception:
                  return 0.0

          def cell(row, idx):
              return row[idx].strip() if idx < len(row) and row[idx] is not None else ""

          def item_id_from_link(link):
              link = str(link or "").strip().rstrip("/")
              return link.split("/")[-1] if link else ""

          def dedupe_products(items):
              out = {}
              for x in items:
                  key = (x["site"], x["itemid"] or x["link"])
                  if not key[1]:
                      continue
                  prev = out.get(key)
                  if prev is None or x["adg"] > prev["adg"]:
                      out[key] = x
              return list(out.values())

          # ============================================================
          # Existing Hot SKU data
          # ============================================================

          cb_url = "https://docs.google.com/spreadsheets/d/e/2PACX-1vT2Z61Z0LxqcTmhjJe5KS_PimpDY4bM-aODeY0CuL9z3EX233KOqWMkXWJteyXQkexOMSqIO3O3rMI-/pub?gid=990111578&single=true&output=csv"
          cb_rows = fetch_dict(cb_url, "CB")

          with open("data_cb.json", "w", encoding="utf-8") as f:
              json.dump(cb_rows, f, ensure_ascii=False)

          cnls_url = "https://docs.google.com/spreadsheets/d/e/2PACX-1vT2Z61Z0LxqcTmhjJe5KS_PimpDY4bM-aODeY0CuL9z3EX233KOqWMkXWJteyXQkexOMSqIO3O3rMI-/pub?gid=1366116887&single=true&output=csv"
          cnls_rows = fetch_dict(cnls_url, "CNLS")

          with open("data_cnls.json", "w", encoding="utf-8") as f:
              json.dump(cnls_rows, f, ensure_ascii=False)

          # ============================================================
          # Phone Case page
          # Source tab: 手机壳飙升词
          # gid = 1028592925
          # CB products: A:R
          # CNLS products: U:AM
          # Keywords: AP:AY
          # ============================================================

          item_url = "https://docs.google.com/spreadsheets/d/e/2PACX-1vT2Z61Z0LxqcTmhjJe5KS_PimpDY4bM-aODeY0CuL9z3EX233KOqWMkXWJteyXQkexOMSqIO3O3rMI-/pub?gid=1028592925&single=true&output=csv"
          item_rows = fetch_csv(item_url, "PHONE_CASE_手机壳飙升词")

          # Resolve keyword columns from the CSV header instead of relying on
          # hard-coded positions. AY / "keyword中文" is the ONLY source for zh.
          if not item_rows:
              raise Exception("PHONE_CASE CSV is empty")

          item_header = [str(x or "").strip() for x in item_rows[0]]

          # IMPORTANT: this sheet contains repeated header names in the
          # CB / CNLS / keyword sections. Keyword fields must be resolved
          # ONLY inside AP:AY (0-based columns 41:50).
          def keyword_header_idx(name):
              for idx in range(41, min(len(item_header), 51)):
                  if item_header[idx] == name:
                      return idx
              raise Exception(
                  f"PHONE_CASE keyword section AP:AY missing required column: {name}"
              )

          KW_SITE_IDX = keyword_header_idx("grass_region")                    # AQ
          KW_L2_IDX = keyword_header_idx("level2_global_be_category")         # AS
          KW_TEXT_IDX = keyword_header_idx("keyword")                         # AT
          KW_CLICK_IDX = keyword_header_idx("current_daily_item_click(SUM)")  # AV
          KW_GROWTH_IDX = keyword_header_idx("daily_item_click_growth(SUM)")  # AX
          KW_ZH_IDX = keyword_header_idx("keyword中文")                        # AY

          print(
              "Keyword columns:",
              "site=", KW_SITE_IDX,
              "L2=", KW_L2_IDX,
              "keyword=", KW_TEXT_IDX,
              "click=", KW_CLICK_IDX,
              "growth=", KW_GROWTH_IDX,
              "zh=", KW_ZH_IDX
          )

          TARGET_L4 = "Phone Cases, Covers, & Skins"

          cb_products = []
          cnls_products = []
          keywords = []

          # Column indexes, 0-based:
          # CB A:R
          # C site / E price / F ADO / I ADO MoM / J ADG / M ADG MoM
          # O link / P image / Q L3 / R L4
          #
          # CNLS U:AM
          # W site / Y price / Z ADO / AC ADO MoM / AD ADG / AG ADG MoM
          # AI link / AJ image / AK L3 / AL L4
          #
          # Keywords AP:AY
          # AQ site / AS L2 / AT keyword / AV item click / AX click growth / AY Chinese translation / AY Chinese translation

          for row in item_rows[1:]:

              # ---------------- CB products ----------------
              cb_l4 = cell(row, 17)  # R
              if cb_l4 == TARGET_L4:
                  link = cell(row, 14)  # O
                  cb_products.append({
                      "site": cell(row, 2),          # C
                      "price": clean_num(cell(row, 4)),      # E
                      "ado": clean_num(cell(row, 5)),        # F
                      "ado_mom": clean_pct(cell(row, 8)),    # I
                      "adg": clean_num(cell(row, 9)),        # J
                      "adg_mom": clean_pct(cell(row, 12)),   # M
                      "link": link,
                      "image": cell(row, 15),        # P
                      "l3": cell(row, 16),           # Q
                      "l4": cb_l4,
                      "itemid": item_id_from_link(link),
                  })

              # ---------------- CNLS products ----------------
              cn_l4 = cell(row, 37)  # AL
              if cn_l4 == TARGET_L4:
                  link = cell(row, 34)  # AI
                  cnls_products.append({
                      "site": cell(row, 22),         # W
                      "price": clean_num(cell(row, 24)),     # Y
                      "ado": clean_num(cell(row, 25)),       # Z
                      "ado_mom": clean_pct(cell(row, 28)),   # AC
                      "adg": clean_num(cell(row, 29)),       # AD
                      "adg_mom": clean_pct(cell(row, 32)),   # AG
                      "link": link,
                      "image": cell(row, 35),        # AJ
                      "l3": cell(row, 36),           # AK
                      "l4": cn_l4,
                      "itemid": item_id_from_link(link),
                  })

              # ---------------- Keywords ----------------
              keyword = cell(row, KW_TEXT_IDX)      # AT / keyword
              site = cell(row, KW_SITE_IDX)          # AQ / grass_region
              keyword_l2 = cell(row, KW_L2_IDX)      # AS / level2_global_be_category

              # Phone-case keyword scope:
              # L2 = Accessories-Cases, Covers, & Skins
              if (
                  keyword
                  and site
                  and keyword_l2 == "Accessories-Cases, Covers, & Skins"
              ):
                  keywords.append({
                      "site": site,
                      "keyword": keyword,
                      "clicks": clean_num(cell(row, KW_CLICK_IDX)),     # AV
                      "growth": clean_pct(cell(row, KW_GROWTH_IDX)),  # AX
                      "zh": cell(row, KW_ZH_IDX),                      # AY / keyword中文 ONLY
                  })

          cb_products = dedupe_products(cb_products)
          cnls_products = dedupe_products(cnls_products)

          if not cb_products and not cnls_products:
              raise Exception(
                  "PHONE_CASE 数据为空：请检查手机壳飙升词 tab 的 gid、发布状态及列范围"
              )

          # ------------------------------------------------------------
          # Phone-case keyword translation normalization
          # AY remains the source translation; this only fixes obvious
          # category-context mistranslations while preserving model names.
          # ------------------------------------------------------------
          import re

          def normalize_phonecase_translation(keyword, zh):
              kw = str(keyword or "").strip()
              out = str(zh or "").strip()

              if not kw:
                  return out

              low = kw.lower()

              # Preserve common device/model tokens from the original keyword.
              model_patterns = [
                  r"iphone\s*\d+(?:\s*(?:pro|max|plus|mini)){0,2}",
                  r"z\s*fold\s*\d+",
                  r"fold\s*\d+",
                  r"s\d+\s*ultra",
                  r"ipad(?:\s*air|\s*pro|\s*mini)?(?:\s*\d+(?:\.\d+)?)?(?:\s*inch)?",
                  r"airpods(?:\s*pro)?(?:\s*\d+)?",
              ]

              models = []
              for pat in model_patterns:
                  for m in re.finditer(pat, low, flags=re.I):
                      token = kw[m.start():m.end()].strip()
                      if token and token.lower() not in [x.lower() for x in models]:
                          models.append(token)

              # In this fixed L2 phone-case scope, these terms mean phone case.
              case_terms = [
                  "case", "cases", "casing", "cover", "covers",
                  "capinha", "funda", "ốp", "ốp lưng",
                  "เคส", "手機殼", "手机壳", "保護殼", "保护壳"
              ]
              is_case = any(term in low for term in [
                  "case", "casing", "cover", "capinha", "funda",
                  "ốp", "เคส", "手機殼", "手机壳"
              ])

              if is_case:
                  # For model-specific queries, construct a clean translation
                  # from the original model name instead of trusting ambiguous MT.
                  if models:
                      # Prefer the longest/more specific model token.
                      model = sorted(models, key=len, reverse=True)[0]
                      # Normalize capitalization for the common product families.
                      norm = model
                      norm = re.sub(r"(?i)\biphone\b", "iPhone", norm)
                      norm = re.sub(r"(?i)\bipad\b", "iPad", norm)
                      norm = re.sub(r"(?i)\bairpods\b", "AirPods", norm)
                      norm = re.sub(r"(?i)\bz\s*fold\b", "Z Fold", norm)
                      norm = re.sub(r"(?i)\bfold\b", "Fold", norm)
                      norm = re.sub(r"(?i)\bpro\b", "Pro", norm)
                      norm = re.sub(r"(?i)\bmax\b", "Max", norm)
                      norm = re.sub(r"(?i)\bultra\b", "Ultra", norm)
                      return f"{norm} 手机壳"

                  # Generic case query.
                  return "手机壳"

              # If it is not clearly a phone-case term, keep AY unchanged.
              return out

          for x in keywords:
              x["zh"] = normalize_phonecase_translation(
                  x.get("keyword"),
                  x.get("zh")
              )

              if x.get("keyword") == "มือถือ 1 บาท ลูกค้า ใหม่":
                  print(
                      "DEBUG TH keyword:",
                      "AT=", repr(x.get("keyword")),
                      "AY=", repr(x.get("zh"))
                  )

          # ------------------------------------------------------------
          # Similar phone-model de-duplication within the SAME site.
          #
          # Examples treated as the same model:
          #   iPhone 15 / iphone15 / ip 15  -> iphone|15|base
          #
          # Examples kept as different models:
          #   iPhone 15      -> iphone|15|base
          #   iPhone 15 Pro  -> iphone|15|pro
          #   iPhone 15 Pro Max -> iphone|15|pro-max
          #
          # Different sites are NEVER merged.
          # If several keywords map to the same model, keep the one with
          # the highest Item Click.
          # ------------------------------------------------------------
          def phone_model_key(keyword, zh):
              raw = f"{keyword or ''} {zh or ''}".lower()
              raw = re.sub(r"[_\\-]+", " ", raw)
              raw = re.sub(r"\s+", " ", raw).strip()

              # iPhone aliases: iphone / ip + generation number.
              m = re.search(
                  r"\b(?:iphone|ip)\s*(\d{1,2})"
                  r"(?:\s*(pro))?"
                  r"(?:\s*(max))?"
                  r"(?:\s*(plus))?"
                  r"(?:\s*(mini))?\b",
                  raw,
                  flags=re.I
              )
              if m:
                  gen = m.group(1)
                  variants = []
                  if m.group(2):
                      variants.append("pro")
                  if m.group(3):
                      variants.append("max")
                  if m.group(4):
                      variants.append("plus")
                  if m.group(5):
                      variants.append("mini")
                  variant = "-".join(variants) if variants else "base"
                  return f"iphone|{gen}|{variant}"

              # Samsung Galaxy S-series, e.g. S26 / S26 Ultra / Galaxy S26 Ultra.
              m = re.search(
                  r"\b(?:samsung\s*)?(?:galaxy\s*)?s\s*(\d{1,2})"
                  r"(?:\s*(ultra|plus|fe))?\b",
                  raw,
                  flags=re.I
              )
              if m:
                  return f"samsung-s|{m.group(1)}|{(m.group(2) or 'base').lower()}"

              # Fold family: Fold 8 / Z Fold 8 / Samsung Fold 8 are treated
              # as the same Fold generation unless another explicit variant exists.
              m = re.search(r"\b(?:samsung\s*)?(?:galaxy\s*)?(?:z\s*)?fold\s*(\d{1,2})\b", raw, flags=re.I)
              if m:
                  return f"fold|{m.group(1)}"

              return ""

          kw_map = {}
          for x in keywords:
              model_key = phone_model_key(x.get("keyword"), x.get("zh"))

              if model_key:
                  # Same site + same normalized model = duplicate.
                  key = (x["site"], "MODEL", model_key)
              else:
                  # Non-model keywords still use normalized Chinese translation.
                  zh_key = re.sub(
                      r"\s+",
                      "",
                      str(x.get("zh") or "").strip().lower()
                  )
                  key = (x["site"], "TEXT", zh_key)

              prev = kw_map.get(key)
              if prev is None or x["clicks"] > prev["clicks"]:
                  kw_map[key] = x

          keywords = list(kw_map.values())

          # ------------------------------------------------------------
          # Tag retained keywords for frontend ranking.
          #
          # "element" means a REAL trendy/theme factor after removing:
          # - phone/device model wording
          # - generic product words such as phone case / tablet case / earbud case
          #
          # This prevents generic terms like "平板保护壳", "fold8手机壳",
          # "iPad a16保护壳" from occupying the Top 11-15 element slots.
          # ------------------------------------------------------------
          def trend_element_key(keyword, zh):
              raw = f"{keyword or ''} {zh or ''}".lower()

              # Normalize separators.
              raw = re.sub(r"[_|/,·\-]+", " ", raw)

              # Remove common phone/device model families, including compact forms.
              model_remove = [
                  r"(?i)\b(?:iphone|ip)\s*\d{1,2}"
                  r"(?:\s*pro)?(?:\s*max)?(?:\s*plus)?(?:\s*mini)?\b",
                  r"(?i)\b(?:samsung\s*)?(?:galaxy\s*)?s\s*\d{1,2}"
                  r"(?:\s*(?:ultra|plus|fe))?\b",
                  r"(?i)\b(?:samsung\s*)?(?:galaxy\s*)?(?:z\s*)?fold\s*\d{1,2}\b",
                  r"(?i)\bfold\s*\d{1,2}\b",
                  r"(?i)\bipad(?:\s*(?:air|pro|mini))?"
                  r"(?:\s*[a-z]?\d+(?:\.\d+)?)?(?:\s*inch|\s*吋|\s*寸)?\b",
                  r"(?i)\bairpods(?:\s*pro)?(?:\s*\d+)?\b",
                  r"(?i)\b(?:galaxy\s*)?buds(?:\s*\d+|\s*pro)?\b",
              ]
              for pat in model_remove:
                  raw = re.sub(pat, " ", raw)

              # Remove generic device/product wording.
              generic_terms = [
                  r"(?i)\bphone\b", r"(?i)\bmobile\b",
                  r"(?i)\btablet\b", r"(?i)\bearbuds?\b",
                  r"(?i)\bheadphones?\b",
                  r"(?i)\bcase\b", r"(?i)\bcases\b",
                  r"(?i)\bcasing\b", r"(?i)\bcover\b", r"(?i)\bcovers\b",
                  r"手机壳", r"手機殼", r"保护壳", r"保護殼",
                  r"平板保护壳", r"平板保護殼",
                  r"耳机壳", r"耳機殼",
                  r"手机", r"手機", r"平板", r"耳机", r"耳機",
                  r"capinha", r"funda", r"ốp\s*lưng", r"ốp", r"เคส",
              ]
              for pat in generic_terms:
                  raw = re.sub(pat, " ", raw)

              # Remove common meaningless modifiers.
              for pat in [
                  r"(?i)\bofficial\b", r"(?i)\boriginal\b",
                  r"(?i)\bnew\b", r"(?i)\bcheap\b",
                  r"(?i)\bfor\b", r"(?i)\bwith\b",
              ]:
                  raw = re.sub(pat, " ", raw)

              raw = re.sub(r"\s+", " ", raw).strip()

              # Nothing meaningful left => not a trendy element.
              if not raw:
                  return ""

              # Known element aliases are normalized for same-site de-duplication.
              aliases = {
                  "spiderman": "蜘蛛侠",
                  "spider man": "蜘蛛侠",
                  "蜘蛛人": "蜘蛛侠",
                  "蜘蛛侠": "蜘蛛侠",
                  "hello kitty": "hello kitty",
                  "hellokitty": "hello kitty",
                  "吉伊卡哇": "吉伊卡哇",
                  "chiikawa": "吉伊卡哇",
                  "bts": "bts",
                  "kuromi": "kuromi",
                  "酷洛米": "kuromi",
                  "库洛米": "kuromi",
                  "sanrio": "sanrio",
                  "三丽鸥": "sanrio",
                  "casetify": "casetify",
                  "disney": "disney",
                  "迪士尼": "disney",
              }

              for k, v in aliases.items():
                  if k in raw:
                      # Keep additional style factor if present, e.g. casetify pink.
                      extra = raw.replace(k, " ").strip()
                      extra = re.sub(r"\s+", " ", extra)
                      return (v + (" " + extra if extra else "")).strip()

              # Unknown residual words are still valid trend/style factors,
              # e.g. pink, floral, glitter, cartoon, character names.
              return raw

          def is_non_phone_accessory_keyword(keyword, zh):
              raw = f"{keyword or ''} {zh or ''}".lower()

              # This page is PHONE CASE only.
              blocked = [
                  "ipad", "tablet",
                  "airpod", "airpods",
                  "earbud", "earbuds",
                  "headphone", "headphones",
                  "kindle",
                  "平板", "耳机", "耳機", "耳塞",
                  "电子书", "電子書", "阅读器", "閱讀器",
              ]
              return any(term in raw for term in blocked)

          # Remove non-phone accessory keywords before Top 10 / element supplement.
          keywords = [
              x for x in keywords
              if not is_non_phone_accessory_keyword(
                  x.get("keyword"),
                  x.get("zh")
              )
          ]

          for x in keywords:
              model_key = phone_model_key(x.get("keyword"), x.get("zh"))
              element_key = trend_element_key(x.get("keyword"), x.get("zh"))

              if model_key:
                  x["keyword_type"] = "model"
                  x["element_key"] = ""
              elif element_key:
                  x["keyword_type"] = "element"
                  x["element_key"] = element_key
              else:
                  x["keyword_type"] = "generic"
                  x["element_key"] = ""

          # Second pass for element rows: same site + same element is one trend.
          # Keep the highest Item Click occurrence.
          final_keywords = []
          element_map = {}

          for x in keywords:
              if x.get("keyword_type") != "element":
                  final_keywords.append(x)
                  continue

              key = (x["site"], x.get("element_key", "").strip().lower())
              prev = element_map.get(key)
              if prev is None or x["clicks"] > prev["clicks"]:
                  element_map[key] = x

          final_keywords.extend(element_map.values())
          keywords = final_keywords

          # Strict validation: Chinese translation must come from AY only.
          # Never substitute AT/original keyword into the Chinese column.
          missing_zh = [
              x for x in keywords
              if not str(x.get("zh") or "").strip()
          ]

          if missing_zh:
              sample = ", ".join(x["keyword"] for x in missing_zh[:5])
              raise Exception(
                  f"PHONE_CASE AY中文翻译为空: {len(missing_zh)} rows; sample: {sample}"
              )

          phonecase_data = {
              "category": TARGET_L4,
              "cb": cb_products,
              "cnls": cnls_products,
              "keywords": keywords,
          }

          with open("phonecase_data.json", "w", encoding="utf-8") as f:
              json.dump(phonecase_data, f, ensure_ascii=False)

          print(
              "OK PHONE_CASE:",
              len(cb_products), "CB items,",
              len(cnls_products), "CNLS items,",
              len(keywords), "keywords"
          )

          EOF

      - name: Commit and push
        run: |
          git config user.name "actions-user"
          git config user.email "actions@github.com"

          git add data_cb.json data_cnls.json phonecase_data.json

          if git diff --staged --quiet; then
            echo "No data changes."
            exit 0
          fi

          git commit -m "Auto sync data"
          git push
