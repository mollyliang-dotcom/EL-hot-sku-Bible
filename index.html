&lt;script&gt;
const CB_DATA_URL   = './data_cb.json';
const CNLS_DATA_URL = './data_cnls.json';
let products = [], filteredData = [], currentPage = 1;
const pageSize = 40;
function getFlagImgHtml(countryCode) {
if (!countryCode || countryCode.length !== 2) return '';
const code = countryCode.toLowerCase();
return '&lt;img class="flag-img" src="https://flagcdn.com/w40/' + code + '.png" alt="' + countryCode + '" onerror="this.style.display=\'none\'"&gt;';
}
function showToast(msg) {
const t = document.getElementById('toast');
t.textContent = msg; t.classList.add('show');
setTimeout(function() { t.classList.remove('show'); }, 2000);
}
const clean = function(s) { return (s || '').toString().replace(/[\t"]/g, '').trim(); };
const toNum = function(s) {
const str = clean(s).replace(/,/g, '').replace(/%/g, '');
return parseFloat(str) || 0;
};
const KNOWN_SITES = ['BR','MX','MY','PH','SG','TH','TW','VN'];
function normalizeSite(raw) {
const s = clean(raw).toUpperCase();
for (let i = 0; i &lt; KNOWN_SITES.length; i++) { if (s === KNOWN_SITES[i]) return KNOWN_SITES[i]; }
for (let i = 0; i &lt; KNOWN_SITES.length; i++) { if (s.indexOf(KNOWN_SITES[i]) !== -1) return KNOWN_SITES[i]; }
return s;
}
function normalizeCBItem(obj) {
return {
itemid:      clean(obj['item_id'] || ''),
year_month:  clean(obj['year_month'] || ''),
site:        normalizeSite(obj['grass_region'] || ''),
title:       clean(obj['item_name'] || ''),
l1:          clean(obj['cb_level1_global_be_category'] || ''),
l2:          clean(obj['level2_global_be_category'] || ''),
l3:          clean(obj['level3_global_be_category'] || ''),
create_date: clean(obj['item_create_date'] || ''),
imgUrl:      clean(obj['product_image'] || ''),
price_usd:   toNum(obj['price_usd'] || 0),
ado:         toNum(obj['ADO(SUM)'] || 0),
ado_mom:     toNum(obj['mom_ado_growth_contri(SUM)'] || 0),
adg_usd:     toNum(obj['ADG_usd(SUM)'] || 0),
productType: 'CB'
};
}
function normalizeCNLSItem(obj) {
const adoDiff    = toNum(obj['ado_diff(RAW)'] || 0);
const benchmarkAdo = toNum(obj['benchmark_ado(RAW)'] || 0);
const adoMom = (benchmarkAdo !== 0) ? (adoDiff / benchmarkAdo) * 100 : 0;
return {
itemid:      clean(obj['item_id'] || ''),
year_month:  clean(obj['year_month'] || ''),
site:        normalizeSite(obj['grass_region'] || ''),
title:       clean(obj['item_name'] || ''),
l1:          clean(obj['cb_level1_global_be_category'] || ''),
l2:          clean(obj['level2_global_be_category'] || ''),
l3:          clean(obj['level3_global_be_category'] || ''),
create_date: clean(obj['item_create_date'] || ''),
imgUrl:      clean(obj['item_image'] || ''),
price_usd:   toNum(obj['item_price_usd'] || 0),
ado:         toNum(obj['current_ado(RAW)'] || 0),
ado_mom:     adoMom,
adg_usd:     toNum(obj['current_adgmv(RAW)'] || 0),
productType: 'CNLS'
};
}
function toRangeStr(val, step) {
const n = parseFloat(val); if (isNaN(n)) return null;
if (n &gt;= 0) { const lo = Math.floor(n/step)*step; return lo + '~' + (lo+step); }
else { const hi = Math.ceil(n/step)*step; return (hi-step) + '~' + hi; }
}
function adoRange(v) {
const n = parseFloat(v); if (isNaN(n) || n === 0) return null;
let step = n &lt; 100 ? 10 : n &lt; 1000 ? 50 : 100;
return toRangeStr(n, step);
}
function adgRange(v) {
const n = parseFloat(v); if (isNaN(n) || n === 0) return null;
let step = n &lt; 100 ? 10 : n &lt; 500 ? 50 : n &lt; 2000 ? 100 : n &lt; 10000 ? 500 : 1000;
return toRangeStr(n, step);
}
function buildSparkline(momVal) {
if (isNaN(momVal) || momVal === null) return '';
const isPos = momVal &gt; 0, isZero = momVal === 0;
const color = isZero ? '#9b8fa0' : (isPos ? '#27ae60' : '#eb4d4b');
const fill  = isZero ? 'rgba(155,143,160,0.08)' : (isPos ? 'rgba(39,174,96,0.10)' : 'rgba(235,77,75,0.10)');
const W = 64, H = 28, mid = 0.5;
const amp  = Math.min(0.45, Math.max(0.05, Math.abs(momVal) / 50 * 0.3));
const endY = isZero ? mid : (isPos ? mid - amp : mid + amp);
const ys   = [mid, mid+(endY-mid)*0.1, mid+(endY-mid)*0.35, mid+(endY-mid)*0.7, endY];
const coords = ys.map(function(y,i) { return { x: +((i*W/(ys.length-1)).toFixed(1)), y: +(y*H).toFixed(1) }; });
let d = 'M' + coords[0].x + ',' + coords[0].y;
for (let i = 1; i &lt; coords.length; i++) {
const cx = (coords[i-1].x + coords[i].x) / 2;
d += ' C' + cx + ',' + coords[i-1].y + ' ' + cx + ',' + coords[i].y + ' ' + coords[i].x + ',' + coords[i].y;
}
const last = coords[coords.length-1];
const fillD = d + ' L' + last.x + ',' + H + ' L' + coords[0].x + ',' + H + ' Z';
return '&lt;svg width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '" xmlns="http://www.w3.org/2000/svg"&gt;'
+ '&lt;path d="' + fillD + '" fill="' + fill + '" stroke="none"/&gt;'
+ '&lt;path d="' + d + '" fill="none" stroke="' + color + '" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/&gt;'
+ '&lt;circle cx="' + last.x + '" cy="' + last.y + '" r="2.2" fill="' + color + '"/&gt;'
+ '&lt;/svg&gt;';
}
function sortData(data, key) {
const s = data.slice();
if (key === 'adoDesc')   s.sort(function(a,b) { return b.ado - a.ado; });
if (key === 'adgDesc')   s.sort(function(a,b) { return b.adg_usd - a.adg_usd; });
if (key === 'priceDesc') s.sort(function(a,b) { return b.price_usd - a.price_usd; });
if (key === 'momDesc')   s.sort(function(a,b) { return b.ado_mom - a.ado_mom; });

async function loadData() {
try {
const [cbRes, cnlsRes] = await Promise.all([
fetch(CB_DATA_URL   + '?t=' + Date.now()),
fetch(CNLS_DATA_URL + '?t=' + Date.now())
]);
if (!cbRes.ok)   throw new Error('CB data HTTP '   + cbRes.status);
if (!cnlsRes.ok) throw new Error('CNLS data HTTP ' + cnlsRes.status);
const cbJson   = await cbRes.json();
const cnlsJson = await cnlsRes.json();
const cbRawList   = Array.isArray(cbJson)   ? cbJson   : (cbJson.data   || []);
const cnlsRawList = Array.isArray(cnlsJson) ? cnlsJson : (cnlsJson.data || []);
const cbProducts   = cbRawList.map(normalizeCBItem).filter(function(p) { return p.itemid; });
const cnlsProducts = cnlsRawList.map(normalizeCNLSItem).filter(function(p) { return p.itemid; });
products = cbProducts.concat(cnlsProducts);
const lastModified = cbRes.headers.get('Last-Modified');
if (lastModified) {
const ld = new Date(lastModified);
document.getElementById('lastUpdateDisplay').textContent =
'数据最后更新: ' + ld.getFullYear() + '/' + (ld.getMonth()+1) + '/' + ld.getDate();
} else {
const _d = new Date();
document.getElementById('lastUpdateDisplay').textContent =
'数据最后更新: ' + _d.getFullYear() + '/' + (_d.getMonth()+1) + '/' + _d.getDate();
}
initFilters(); applyFilters();
} catch(e) {
document.getElementById('productGrid').innerHTML =
'&lt;div class="loading-state"&gt;数据加载失败：' + e.message + '&lt;/div&gt;';
}
}

l1s.sort();
const el = document.getElementById('l1Filter');
el.innerHTML = '&lt;option value=""&gt;L1 类目&lt;/option&gt;';
l1s.forEach(function(v) { el.innerHTML += '&lt;option value="' + v + '"&gt;' + v + '&lt;/option&gt;'; });

function updateL2() {

const el = document.getElementById('l2Filter');
el.innerHTML = '&lt;option value=""&gt;L2 类目&lt;/option&gt;';

products.filter(function(p) { return !l1 || p.l1 === l1; })
.forEach(function(p) { const v = p.l2; if (v &amp;&amp; !seen[v]) { seen[v] = 1; vals.push(v); } });

function updateL3() {

function isNewSku(p) {
const dateStr = p.create_date;
if (!dateStr) return false;
const createTime = new Date(dateStr).getTime();
if (isNaN(createTime)) return false;
if (!window._todayMs) {
const t = new Date(); t.setHours(0,0,0,0);
window._todayMs = t.getTime();
}
const diffDays = (window._todayMs - createTime) / 86400000;

}
function render(dataList, page) {

function applyFilters() {

const pal=['#FFB5A7','#FCD5CE','#F9DCC4','#CDEAC0','#BDE0FE','#A2D2FF','#CDB4DB','#FFC8DD','#D8E2DC','#E8D7F1','#D0F4DE','#FFF1E6'];

 if(!pts.length){$(id).innerHTML='&lt;div class="empty"&gt;暂无数据&lt;/div&gt;';return}
 const ma=Math.max(...pts.map(x=&gt;x.ado),1),mg=Math.max(...pts.map(x=&gt;x.adg),1);let d='';
 pts.forEach((q,i)=&gt;{const x=55+q.ado/ma*460,y=285-q.adg/mg*235,r=9+Math.sqrt((q.ado/ma+q.adg/mg)/2)*17,c=pal[i%pal.length],s=q.name.length&gt;13?q.name.slice(0,13)+'…':q.name;d+=`&lt;circle class="dot" cx="${x}" cy="${y}" r="${r}" fill="${c}"&gt;&lt;title&gt;${esc(q.name)}&lt;/title&gt;&lt;/circle&gt;&lt;text class="label" x="${x}" y="${y+3}" text-anchor="middle"&gt;${esc(s)}&lt;/text&gt;`});
 $(id).innerHTML=`&lt;svg viewBox="0 0 560 330"&gt;&lt;line x1="48" y1="290" x2="525" y2="290" stroke="#eadfe4"/&gt;&lt;line x1="48" y1="290" x2="48" y2="38" stroke="#eadfe4"/&gt;&lt;text class="axis" x="490" y="315"&gt;ADO 高 →&lt;/text&gt;&lt;text class="axis" x="12" y="50"&gt;ADGMV 高 ↑&lt;/text&gt;${d}&lt;/svg&gt;`;
}
function renderBubbles(){const d=bubbleRows();drawBubble('siteBubble',agg(d,'site').filter(x=&gt;x.name!=='未分类'));drawBubble('l1Bubble',agg(d,'l1').filter(x=&gt;x.name!=='未分类'))}

function rangeStr(v,step){const x=Number(v);if(!Number.isFinite(x)||x===0)return '—';const lo=Math.floor(x/step)*step;return lo+'~'+(lo+step)}
function adoRange(v){const x=Number(v);return !x?'—':rangeStr(x,x&lt;100?10:x&lt;1000?50:100)}
function adgRange(v){const x=Number(v);return !x?'—':rangeStr(x,x&lt;100?10:x&lt;500?50:x&lt;2000?100:x&lt;10000?500:1000)}
function momCell(v){const x=Number(v)||0,cls=x&gt;0?'mom-pos':x&lt;0?'mom-neg':'mom-zero';return `&lt;span class="${cls}"&gt;${x&gt;0?'+':''}${x.toFixed(1)}%&lt;/span&gt;`}
function price(v){return Number(v)&gt;0?'$'+Number(v).toFixed(2):'—'}

function currentProducts(){return typ==='CB'?phoneData.cb:phoneData.cnls}

 const sites=[...new Set(currentProducts().map(x=&gt;x.site).filter(Boolean))].sort();
 const old=$('siteFilter').value;
 $('siteFilter').innerHTML='&lt;option value=""&gt;全部站点&lt;/option&gt;'+sites.map(s=&gt;`&lt;option value="${esc(s)}"&gt;${esc(s)}&lt;/option&gt;`).join('');
 if(sites.includes(old))$('siteFilter').value=old;
}
function renderProducts(){
 const site=$('siteFilter').value,metric=$('sortFilter').value;
 let d=currentProducts().filter(x=&gt;!site||x.site===site);
 d=d.slice().sort((a,b)=&gt;Number(b[metric]||0)-Number(a[metric]||0)).slice(0,10);
 $('productBody').innerHTML=d.map((x,i)=&gt;`&lt;tr&gt;
 &lt;td&gt;${i+1}&lt;/td&gt;
 &lt;td&gt;${x.image?`&lt;img class="thumb" src="${esc(x.image)}" loading="lazy"&gt;`:'—'}&lt;/td&gt;
 &lt;td&gt;${esc(x.itemid)}&lt;/td&gt;&lt;td&gt;${esc(x.site)}&lt;/td&gt;
 &lt;td&gt;${price(x.price)}&lt;/td&gt;&lt;td&gt;${adoRange(x.ado)}&lt;/td&gt;&lt;td&gt;${x.adg?'$'+adgRange(x.adg):'—'}&lt;/td&gt;
 &lt;td&gt;${momCell(x.ado_mom)}&lt;/td&gt;&lt;td&gt;${momCell(x.adg_mom)}&lt;/td&gt;&lt;/tr&gt;`).join('')||'&lt;tr&gt;&lt;td colspan="9" class="empty"&gt;暂无数据&lt;/td&gt;&lt;/tr&gt;';

function renderKeywords(){
 const card=$('keywordCard');
 if(typ!=='CB'){card.style.display='none';return}
 card.style.display='block';

 let all=phoneData.keywords
   .filter(x=&gt;!site||x.site===site)
   .slice()
   .sort((a,b)=&gt;Number(b.clicks||0)-Number(a.clicks||0));

 const top10=all.slice(0,10);

 // Supplement only NON-MODEL keywords that are outside Top 10.
 // Add as many as available, but at most 5 so total &lt;= 15.
 const topKeys=new Set(top10.map(x=&gt;`${x.site}||${x.keyword}`));
 const elementExtra=all
   .slice(10)
   .filter(x=&gt;x.keyword_type==='element'&amp;&amp;!topKeys.has(`${x.site}||${x.keyword}`))
   .slice(0,5);

 const d=[...top10,...elementExtra];

 $('keywordBody').innerHTML=d.map((x,i)=&gt;`&lt;tr&gt;&lt;td&gt;${i+1}&lt;/td&gt;&lt;td&gt;${esc(x.site)}&lt;/td&gt;&lt;td class="kw"&gt;${esc(x.keyword)}&lt;/td&gt;&lt;td class="kw"&gt;${esc(x.zh||'—')}&lt;/td&gt;&lt;td&gt;${momCell(x.growth)}&lt;/td&gt;&lt;/tr&gt;`).join('')||'&lt;tr&gt;&lt;td colspan="5" class="empty"&gt;暂无关键词数据&lt;/td&gt;&lt;/tr&gt;';

function renderAll(){renderBubbles();refillSites();renderProducts();renderKeywords()}
async function load(){

  ]);

  bubbleCN=(Array.isArray(b)?b:b.data||[]).map(NCN);
  phoneData=p;
  renderAll();
  $('update').textContent='数据最后更新: '+new Date().toLocaleDateString('zh-CN');
 }catch(e){$('update').textContent='数据加载失败';$('productBody').innerHTML='&lt;tr&gt;&lt;td colspan="10" class="empty"&gt;'+esc(e.message)+'&lt;/td&gt;&lt;/tr&gt;'}
}
document.querySelectorAll('.tab').forEach(b=&gt;b.addEventListener('click',()=&gt;{document.querySelectorAll('.tab').forEach(x=&gt;x.classList.remove('active'));b.classList.add('active');typ=b.dataset.t;$('siteFilter').value='';renderAll()}));
$('siteFilter').addEventListener('change',()=&gt;{renderProducts();renderKeywords()});
$('sortFilter').addEventListener('change',renderProducts);
$('resetBtn').addEventListener('click',()=&gt;{$('siteFilter').value='';$('sortFilter').value='ado';renderProducts();renderKeywords()});
$('productBody').addEventListener('click',e=&gt;{const im=e.target.closest('.thumb');if(im){$('modalImg').src=im.src;$('modal').classList.add('show')}});
$('modal').addEventListener('click',()=&gt;{$('modal').classList.remove('show');$('modalImg').src=''});
window.addEventListener('load',load);
&lt;/script&gt;

async function fetchJson(url,label){
  try{
    const r=await fetch(url+'?t='+Date.now(),{cache:'no-store'});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const j=await r.json();
    return {rows:Array.isArray(j)?j:(j.data||[]),error:''};
  }catch(e){
    return {rows:[],error:label+' '+e.message};
  }
}

  cbError=cbResult.error;
  cnError=cnResult.error;
  cb=cbResult.rows.map(NCB).filter(x=&gt;x.id);
  cn=cnResult.rows.map(NCN).filter(x=&gt;x.id);
  refill();
  render();
  $('update').textContent=(cb.length||cn.length)
    ? '数据最后更新: '+new Date().toLocaleDateString('zh-CN')
    : '数据加载失败';
}
window.addEventListener('load',load);
&lt;/script&gt;&lt;/body&gt;&lt;/html&gt;
</textarea>
<script>
function withBase(t){
  const b=new URL('.',location.href).href;
  return t.replace(/<head([^>]*)>/i,'<head$1><base href="'+b+'">');
}
skuFrame.srcdoc=withBase(hotSkuSource.value.trim());
phoneCaseFrame.srcdoc=withBase(phoneCaseSource.value.trim());
trendFrame.srcdoc=withBase(trendSource.value.trim());
categoryFrame.srcdoc=withBase(categorySource.value.trim());

function switchPage(p){
  skuFrame.classList.toggle('active',p==='sku');
  phoneCaseFrame.classList.toggle('active',p==='phonecase');
  trendFrame.classList.toggle('active',p==='trend');
  categoryFrame.classList.toggle('active',p==='category');
  history.replaceState(null,'','#'+p);
}
if(location.hash==='#phonecase')switchPage('phonecase');
else if(location.hash==='#trend')switchPage('trend');
else if(location.hash==='#category')switchPage('category');
</script>
