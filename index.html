<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopee EL 选品指南</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #EE4D2D;
            --primary-light: #fff5f2;
            --primary-dark: #d73211;
            --accent: #F4A855;
            --bg: #faf8f9;
            --card-bg: #ffffff;
            --text: #2d2038;
            --text-muted: #9b8fa0;
            --border: #f0e8ed;
            --success: #27ae60;
            --info: #2980b9;
            --tag-bg: #fff3f7;
            --danger: #eb4d4b;
            --shadow: 0 2px 16px rgba(238,77,45,0.07);
            --shadow-hover: 0 8px 32px rgba(238,77,45,0.16);
            --radius: 16px;
            --radius-sm: 8px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'DM Sans', 'PingFang SC', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        header {
            background: linear-gradient(135deg, #FF6633 0%, #EE4D2D 50%, #D02D11 100%);
            color: white;
            padding: 36px 40px 28px;
            position: relative;
            overflow: hidden;
        }
        header::before {
            content: '';
            position: absolute; top: -60px; right: -60px;
            width: 280px; height: 280px;
            background: rgba(255,255,255,0.08);
            border-radius: 50%;
        }
        .header-inner { max-width: 1280px; margin: 0 auto; position: relative; z-index: 1; }
        header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 32px;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        header h1 .badge {
            background: rgba(255,255,255,0.25);
            font-family: 'DM Sans', sans-serif;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.3);
        }
        .header-desc {
            margin-top: 14px;
            background: rgba(0,0,0,0.1);
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            line-height: 1.8;
            max-width: 700px;
            border-left: 3px solid rgba(255,255,255,0.7);
        }
        .last-update-tag {
            position: absolute; top: 20px; right: 40px;
            background: rgba(255,255,255,0.15);
            padding: 6px 12px; border-radius: 30px; font-size: 12px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.2);
        }

        .container { max-width: 1280px; margin: 0 auto; padding: 28px 24px; }

        .filter-section {
            background: var(--card-bg);
            padding: 20px 24px;
            border-radius: var(--radius);
            margin-bottom: 24px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }
        .filter-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
        .filter-row + .filter-row { margin-top: 12px; }
        .filter-label {
            font-size: 11px; font-weight: 600; color: var(--text-muted);
            text-transform: uppercase; letter-spacing: 1px; white-space: nowrap;
        }
        input[type="text"], select {
            padding: 9px 14px;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            font-family: 'DM Sans', sans-serif;
            font-size: 13px; color: var(--text); background: var(--bg);
            transition: border-color 0.2s, box-shadow 0.2s; outline: none;
        }
        input[type="text"]:focus, select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-light);
        }

        /* 排序下拉高亮激活态 */
        select#sortOrder {
            border-color: var(--primary);
            color: var(--primary-dark);
            font-weight: 600;
        }

        .switch-container {
            display: flex; align-items: center; gap: 8px;
            background: var(--bg); padding: 6px 12px;
            border-radius: var(--radius-sm); border: 1.5px solid var(--border); cursor: pointer;
        }
        .switch-container input { cursor: pointer; }
        .count-badge {
            margin-left: auto;
            background: var(--primary-light); color: var(--primary-dark);
            font-weight: 700; font-size: 13px; padding: 6px 14px; border-radius: 20px;
        }
        .btn-clear {
            padding: 9px 16px; background: transparent;
            border: 1.5px solid var(--border); border-radius: var(--radius-sm);
            color: var(--text-muted); font-family: 'DM Sans', sans-serif;
            font-size: 13px; cursor: pointer; transition: all 0.2s;
        }
        .btn-clear:hover { border-color: var(--primary); color: var(--primary); }

        .loading-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }
        .loading-spinner {
            width: 36px; height: 36px;
            border: 3px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
            gap: 20px;
        }

        .card {
            background: var(--card-bg); border-radius: var(--radius);
            overflow: hidden; border: 1px solid var(--border);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            position: relative; display: flex; flex-direction: column;
        }
        .card:hover { transform: translateY(-4px); box-shadow: var(--shadow-hover); border-color: #ffd6cc; }

        .site-tag {
            position: absolute; top: 10px; left: 10px;
            background: var(--primary); color: white;
            font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 20px; z-index: 10;
        }
        .img-container {
            width: 100%; height: 220px; background: #fffafa; overflow: hidden;
            border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: center; cursor: zoom-in;
        }
        .img-container img { max-width: 100%; max-height: 100%; object-fit: contain; transition: transform 0.4s ease; }

        .info { padding: 14px 16px; flex-grow: 1; display: flex; flex-direction: column; gap: 8px; }

        .item-title {
            font-weight: 600; font-size: 14px; line-height: 1.45; height: 40px;
            overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
            color: var(--text);
        }

        .price-row { display: flex; align-items: baseline; gap: 6px; }
        .price-label { font-size: 11px; color: var(--text-muted); font-weight: 500; }
        .price-value { color: var(--primary); font-size: 18px; font-weight: 700; }

        .meta-row { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
        .pill { font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 20px; border: 1px solid transparent; }
        .pill-cat { background: var(--tag-bg); color: var(--primary-dark); border-color: #f5c5d2; }

        .ado-block {
            display: flex; align-items: center; gap: 8px;
            background: var(--bg); border: 1px solid var(--border);
            border-radius: var(--radius-sm); padding: 6px 10px;
        }
        .ado-label { font-size: 10px; color: var(--text-muted); font-weight: 600; white-space: nowrap; }
        .ado-range { font-size: 12px; font-weight: 700; white-space: nowrap; }
        .ado-range.pos { color: var(--success); }
        .ado-range.neg { color: var(--danger); }
        .ado-range.zero { color: var(--text-muted); }
        .sparkline-wrap { flex: 1; display: flex; align-items: center; justify-content: flex-end; }
        .sparkline-wrap svg { display: block; }

        .stats-row { display: flex; gap: 8px; }
        .stat-box {
            flex: 1; background: var(--bg); border: 1px solid var(--border);
            border-radius: var(--radius-sm); padding: 6px 10px; text-align: center;
        }
        .stat-label { font-size: 10px; color: var(--text-muted); font-weight: 600; margin-bottom: 2px; }
        .stat-value { font-size: 12px; font-weight: 700; white-space: nowrap; }
        .stat-value.ado-val { color: var(--success); }
        .stat-value.adg-val { color: var(--info); }

        .footer-row {
            display: flex; justify-content: space-between; align-items: center;
            border-top: 1px solid var(--border); padding-top: 10px; margin-top: auto;
            font-size: 11px; color: var(--text-muted);
        }
        .itemid-box {
            font-family: monospace; background: var(--bg); padding: 2px 7px;
            border-radius: 4px; border: 1px dashed #ddd; cursor: pointer;
        }

        #imageModal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 9999;
            justify-content: center; align-items: center; cursor: zoom-out;
        }
        #imageModal img { max-width: 90vw; max-height: 90vh; border-radius: 8px; }

        #toast {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(20px);
            background: #333; color: white; padding: 10px 22px; border-radius: 30px;
            font-size: 13px; opacity: 0; transition: all 0.3s; z-index: 10000;
        }
        #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        .pagination { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 32px 0; }
        .pagination button {
            padding: 8px 16px; border: 1.5px solid var(--border);
            background: white; cursor: pointer; border-radius: var(--radius-sm);
            font-family: 'DM Sans', sans-serif; transition: all 0.2s;
        }
        .pagination button:hover:not(:disabled) { border-color: var(--primary); color: var(--primary); }
        .pagination button:disabled { opacity: 0.4; cursor: not-allowed; }

        footer { text-align: center; color: var(--text-muted); font-size: 11px; padding: 40px; border-top: 1px solid var(--border); }
    </style>
</head>
<body>

<header>
    <div class="header-inner">
        <h1>🛍️ Shopee EL 选品指南 <span class="badge">External</span></h1>
        <div class="header-desc">
            ✨ <strong>精选热销品新品</strong> · 涵盖多站点，帮你快速锁定爆款选品<br>
            📊 ADO 与 ADG 采用区间脱敏展示，价格以 USD 原价展示<br>
            🔒 提示：当前页面仅供内部选品参考，不提供外部商品跳转链接。
        </div>
        <div class="last-update-tag" id="lastUpdateDisplay">数据更新中...</div>
    </div>
</header>

<div class="container">
    <div class="filter-section">
        <!-- 第一行：搜索 + 类目 + 排序 -->
        <div class="filter-row">
            <span class="filter-label">🔍</span>
            <input type="text" id="searchInput" placeholder="搜索标题 / ID..." oninput="debouncedFilter()">

            <select id="l1Filter" onchange="updateL2(); applyFilters()">
                <option value="">L1 类目</option>
            </select>
            <select id="l2Filter" onchange="updateL3(); applyFilters()">
                <option value="">L2 类目</option>
            </select>
            <select id="l3Filter" onchange="applyFilters()">
                <option value="">L3 类目</option>
            </select>

            <!-- 排序：三个选项，默认 ADO 降序 -->
            <span class="filter-label">📊 排序</span>
            <select id="sortOrder" onchange="applyFilters()">
                <option value="adoDesc" selected>单量 (ADO) ↓</option>
                <option value="adgDesc">销售额 (ADG) ↓</option>
                <option value="priceDesc">价格 ↓</option>
            </select>

            <button class="btn-clear" onclick="clearFilters()">✕ 重置</button>
            <span class="count-badge" id="countDisplay">—</span>
        </div>

        <!-- 第二行：站点 + Top New -->
        <div class="filter-row">
            <span class="filter-label">🌏 站点</span>
            <select id="siteFilter" onchange="applyFilters()">
                <option value="">全部站点</option>
                <option value="BR">🇧🇷 BR</option>
                <option value="MX">🇲🇽 MX</option>
                <option value="MY">🇲🇾 MY</option>
                <option value="PH">🇵🇭 PH</option>
                <option value="SG">🇸🇬 SG</option>
                <option value="TH">🇹🇭 TH</option>
                <option value="TW">🇹🇼 TW</option>
                <option value="VN">🇻🇳 VN</option>
            </select>

            <label class="switch-container">
                <input type="checkbox" id="topNewFilter" onchange="applyFilters()">
                <span style="font-size: 13px; font-weight: 500;">🔥 Top New SKU</span>
            </label>
        </div>
    </div>

    <div class="product-grid" id="productGrid">
        <div class="loading-state">
            <div class="loading-spinner"></div>
            <div>数据加载中，请稍候...</div>
        </div>
    </div>
    <div class="pagination" id="pagination"></div>
</div>

<div id="imageModal" onclick="this.style.display='none'"><img id="modalImg" src=""></div>
<div id="toast"></div>
<footer>Shopee EL 选品指南</footer>

<script>
    const DATA_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vT2Z61Z0LxqcTmhjJe5KS_PimpDY4bM-aODeY0CuL9z3EX233KOqWMkXWJteyXQkexOMSqIO3O3rMI-/pub?gid=990111578&single=true&output=csv';

    let products = [], filteredData = [], currentPage = 1;
    const pageSize = 40;

    const siteFlag = {
        BR: '🇧🇷', MX: '🇲🇽', MY: '🇲🇾', PH: '🇵🇭',
        SG: '🇸🇬', TH: '🇹🇭', TW: '🇹🇼', VN: '🇻🇳'
    };

    function showToast(msg) {
        const t = document.getElementById('toast');
        t.textContent = msg; t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 2000);
    }

    const clean = (s) => (s || '').toString().replace(/[\t"]/g, '').trim();
    const toNum = (s) => parseFloat(clean(s)) || 0;

    /**
     * CSV 字段映射：
     * arr[0]  item_id
     * arr[1]  year_month
     * arr[2]  grass_region                  → site
     * arr[3]  item_name
     * arr[4]  cb_level1_global_be_category  → L1
     * arr[5]  level2_global_be_category     → L2
     * arr[6]  level3_global_be_category     → L3
     * arr[7]  item_create_date
     * arr[8]  product_image
     * arr[9]  product_link
     * arr[10] price_usd                     → 直接展示
     * arr[11] ADO(SUM)                      → 区间脱敏，每10一档；默认排序字段
     * arr[12] mom_ado_growth_contri(SUM)    → sparkline 方向
     * arr[13] ADG_usd(SUM)                  → 区间脱敏，动态档位
     */
    const mapData = (arr) => ({
        itemid:      clean(arr[0]),
        year_month:  clean(arr[1]),
        site:        clean(arr[2]),
        title:       clean(arr[3]),
        l1:          clean(arr[4]),
        l2:          clean(arr[5]),
        l3:          clean(arr[6]),
        create_date: clean(arr[7]),
        imgUrl:      clean(arr[8]),
        link:        clean(arr[9]),
        price_usd:   toNum(arr[10]),
        ado:         toNum(arr[11]),
        ado_mom:     clean(arr[12]),
        adg_usd:     toNum(arr[13]),
    });

    /* ── CSV 解析 ──────────────────────────────────────────────── */
    function parseCSV(text) {
        const rows = [];
        const lines = text.split(/\r?\n/);
        for (const line of lines) {
            if (!line.trim()) continue;
            const row = [];
            let cur = '', inQuote = false;
            for (let i = 0; i < line.length; i++) {
                const ch = line[i];
                if (ch === '"') {
                    if (inQuote && line[i+1] === '"') { cur += '"'; i++; }
                    else inQuote = !inQuote;
                } else if (ch === ',' && !inQuote) {
                    row.push(cur.trim()); cur = '';
                } else {
                    cur += ch;
                }
            }
            row.push(cur.trim());
            rows.push(row);
        }
        return rows;
    }

    /* ── 区间脱敏 ──────────────────────────────────────────────── */
    function toRangeStr(val, step) {
        const n = parseFloat(val);
        if (isNaN(n)) return null;
        if (n >= 0) {
            const lo = Math.floor(n / step) * step;
            return `${lo}~${lo + step}`;
        } else {
            const hi = Math.ceil(n / step) * step;
            return `${hi - step}~${hi}`;
        }
    }

    const adoRange = (v) => toRangeStr(v, 10);

    function adgRange(v) {
        const n = parseFloat(v);
        if (isNaN(n) || n === 0) return null;
        let step;
        if      (n < 100)   step = 10;
        else if (n < 500)   step = 50;
        else if (n < 2000)  step = 100;
        else if (n < 10000) step = 500;
        else                step = 1000;
        return toRangeStr(n, step);
    }

    /* ── ADO MoM Sparkline ─────────────────────────────────────── */
    function buildSparkline(adoMomStr, itemid) {
        const val = parseFloat(adoMomStr);
        if (isNaN(val)) return '';
        const isPos = val >= 0;
        const color = isPos ? '#27ae60' : '#eb4d4b';
        const fill  = isPos ? 'rgba(39,174,96,0.10)' : 'rgba(235,77,75,0.10)';

        let seed = 0;
        for (let i = 0; i < itemid.length; i++) seed = (seed * 31 + itemid.charCodeAt(i)) & 0xffffffff;
        const rand = (i) => { let x = Math.sin(seed + i) * 10000; return x - Math.floor(x); };

        const W = 64, H = 28, pts = 5;
        const rawY = [];
        for (let i = 0; i < pts - 1; i++) rawY.push(0.3 + rand(i) * 0.4);
        rawY.push(isPos ? 0.05 + rand(pts) * 0.15 : 0.80 + rand(pts) * 0.15);

        const xStep  = W / (pts - 1);
        const coords = rawY.map((y, i) => ({ x: +(i * xStep).toFixed(1), y: +(y * H).toFixed(1) }));

        let d = `M${coords[0].x},${coords[0].y}`;
        for (let i = 1; i < coords.length; i++) {
            const cx = (coords[i-1].x + coords[i].x) / 2;
            d += ` C${cx},${coords[i-1].y} ${cx},${coords[i].y} ${coords[i].x},${coords[i].y}`;
        }
        const fillD = `${d} L${coords[coords.length-1].x},${H} L${coords[0].x},${H} Z`;

        return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">
            <path d="${fillD}" fill="${fill}" stroke="none"/>
            <path d="${d}" fill="none" stroke="${color}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="${coords[coords.length-1].x}" cy="${coords[coords.length-1].y}" r="2.2" fill="${color}"/>
        </svg>`;
    }

    /* ── 排序函数 ──────────────────────────────────────────────── */
    function sortData(data, sortKey) {
        const sorted = [...data];
        switch (sortKey) {
            case 'adoDesc':  // 单量 ADO(SUM) 降序（默认）
                sorted.sort((a, b) => toNum(b[11]) - toNum(a[11]));
                break;
            case 'adgDesc':  // 销售额 ADG_usd(SUM) 降序
                sorted.sort((a, b) => toNum(b[13]) - toNum(a[13]));
                break;
            case 'priceDesc': // 价格 price_usd 降序
                sorted.sort((a, b) => toNum(b[10]) - toNum(a[10]));
                break;
        }
        return sorted;
    }

    /* ── 数据加载 ──────────────────────────────────────────────── */
    async function loadData() {
        try {
            const res = await fetch(DATA_URL);
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const text = await res.text();

            const rows = parseCSV(text);
            if (rows.length < 2) throw new Error('数据为空');

            products = rows.slice(1).filter(a => a[0] && a[0].trim());

            const dates = products.map(p => new Date(clean(p[7]))).filter(d => !isNaN(d));
            if (dates.length) {
                const latest = new Date(Math.max(...dates));
                document.getElementById('lastUpdateDisplay').textContent =
                    `数据最后更新: ${latest.toLocaleDateString('zh-CN')}`;
            }

            initFilters();
            applyFilters();  // 初始加载默认按 ADO 降序（sortOrder 默认值为 adoDesc）
        } catch (e) {
            document.getElementById('productGrid').innerHTML = `
                <div class="loading-state">
                    ⚠️ 数据加载失败：${e.message}<br>
                    <small style="margin-top:8px;display:block;">请检查数据源链接或网络连接后刷新重试。</small>
                </div>`;
            console.error('数据加载错误:', e);
        }
    }

    /* ── 筛选器初始化 ──────────────────────────────────────────── */
    function initFilters() {
        const l1s  = [...new Set(products.map(p => clean(p[4])))].filter(Boolean).sort();
        const l1El = document.getElementById('l1Filter');
        l1El.innerHTML = '<option value="">L1 类目</option>';
        l1s.forEach(v => l1El.innerHTML += `<option value="${v}">${v}</option>`);
        updateL2();
    }

    function updateL2() {
        const l1 = document.getElementById('l1Filter').value;
        const s  = document.getElementById('l2Filter');
        s.innerHTML = '<option value="">L2 类目</option>';
        [...new Set(products.filter(p => !l1 || clean(p[4]) === l1).map(p => clean(p[5])))]
            .filter(Boolean).sort()
            .forEach(v => s.innerHTML += `<option value="${v}">${v}</option>`);
        updateL3();
    }

    function updateL3() {
        const l1 = document.getElementById('l1Filter').value;
        const l2 = document.getElementById('l2Filter').value;
        const s  = document.getElementById('l3Filter');
        s.innerHTML = '<option value="">L3 类目</option>';
        [...new Set(products.filter(p =>
            (!l1 || clean(p[4]) === l1) && (!l2 || clean(p[5]) === l2)
        ).map(p => clean(p[6])))]
            .filter(Boolean).sort()
            .forEach(v => s.innerHTML += `<option value="${v}">${v}</option>`);
    }

    /* ── 卡片渲染 ──────────────────────────────────────────────── */
    function render(dataList, page = 1) {
        currentPage = page;
        const grid = document.getElementById('productGrid');
        grid.innerHTML = '';
        const pageData = dataList.slice((page - 1) * pageSize, page * pageSize);

        if (pageData.length === 0) {
            grid.innerHTML = `<div class="loading-state">😕 没有找到符合条件的商品</div>`;
            renderPagination(0);
            return;
        }

        pageData.forEach(arr => {
            const item = mapData(arr);
            const emoji = siteFlag[item.site] || '🌐';
            const siteLabel = item.site ? `${emoji} ${item.site}` : '🌐';

            const priceDisplay = item.price_usd ? `$${item.price_usd.toFixed(2)}` : '—';
            const adoRangeStr  = adoRange(item.ado);
            const adgRangeStr  = adgRange(item.adg_usd);

            const adoMomVal = parseFloat(item.ado_mom);
            const adoClass  = isNaN(adoMomVal) ? 'zero' : (adoMomVal > 0 ? 'pos' : adoMomVal < 0 ? 'neg' : 'zero');
            const adoIcon   = adoMomVal > 0 ? '▲' : adoMomVal < 0 ? '▼' : '–';
            const sparkSvg  = buildSparkline(item.ado_mom, item.itemid);

            const adoMomBlockHtml = (adoRangeStr && sparkSvg) ? `
                <div class="ado-block">
                    <span class="ado-label">ADO MoM</span>
                    <span class="ado-range ${adoClass}">${adoIcon} ${adoRangeStr}</span>
                    <div class="sparkline-wrap">${sparkSvg}</div>
                </div>` : '';

            const l3Html = item.l3 ? `<span class="pill pill-cat">${item.l3}</span>` : '';

            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="site-tag">${siteLabel}</div>
                <div class="img-container" onclick="openModal('${item.imgUrl}')">
                    <img src="${item.imgUrl}" loading="lazy" onerror="this.src='https://via.placeholder.com/200?text=No+Image'">
                </div>
                <div class="info">
                    <div class="item-title" title="${item.title}">${item.title}</div>
                    <div class="price-row">
                        <span class="price-label">价格</span>
                        <span class="price-value">${priceDisplay}</span>
                    </div>
                    ${l3Html ? `<div class="meta-row">${l3Html}</div>` : ''}
                    ${adoMomBlockHtml}
                    <div class="stats-row">
                        <div class="stat-box">
                            <div class="stat-label">ADO (件/日)</div>
                            <div class="stat-value ado-val">${adoRangeStr || '—'}</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-label">ADG (USD/日)</div>
                            <div class="stat-value adg-val">${adgRangeStr ? '$' + adgRangeStr : '—'}</div>
                        </div>
                    </div>
                    <div class="footer-row">
                        <span>📅 ${item.create_date || item.year_month}</span>
                        <span class="itemid-box" onclick="copyId('${item.itemid}')">ID: ${item.itemid}</span>
                    </div>
                </div>`;
            grid.appendChild(card);
        });
        renderPagination(dataList.length);
    }

    function openModal(src) {
        document.getElementById('modalImg').src = src;
        document.getElementById('imageModal').style.display = 'flex';
    }
    function copyId(id) {
        navigator.clipboard.writeText(id).then(() => showToast(`已复制 ID: ${id}`));
    }

    function renderPagination(total) {
        const totalPages = Math.ceil(total / pageSize) || 1;
        document.getElementById('pagination').innerHTML = `
            <button onclick="changePage(-1)" ${currentPage === 1 ? 'disabled' : ''}>←</button>
            <span style="font-size:13px;color:var(--text-muted)">${currentPage} / ${totalPages}</span>
            <button onclick="changePage(1)" ${currentPage >= totalPages ? 'disabled' : ''}>→</button>`;
    }

    function changePage(d) { render(filteredData, currentPage + d); window.scrollTo(0, 0); }

    /* ── 过滤 & 排序 ───────────────────────────────────────────── */
    function applyFilters() {
        const q        = document.getElementById('searchInput').value.toLowerCase();
        const l1       = document.getElementById('l1Filter').value;
        const l2       = document.getElementById('l2Filter').value;
        const l3       = document.getElementById('l3Filter').value;
        const site     = document.getElementById('siteFilter').value;
        const isTopNew = document.getElementById('topNewFilter').checked;
        const sort     = document.getElementById('sortOrder').value;  // 始终有值

        // 过滤
        const filtered = products.filter(arr => {
            const i = mapData(arr);
            const matchTopNew = !isTopNew || isTopNewItem(arr);
            return (!q    || i.title.toLowerCase().includes(q) || i.itemid.includes(q)) &&
                   (!l1   || i.l1 === l1) &&
                   (!l2   || i.l2 === l2) &&
                   (!l3   || i.l3 === l3) &&
                   (!site || i.site === site) &&
                   matchTopNew;
        });

        // 排序（始终执行，默认 adoDesc）
        filteredData = sortData(filtered, sort);

        document.getElementById('countDisplay').textContent = `共 ${filteredData.length} 款`;
        render(filteredData, 1);
    }

    function isTopNewItem(arr) {
        if (!window._latestMonth) {
            const months = products.map(p => clean(p[1])).filter(Boolean).sort();
            window._latestMonth = months[months.length - 1];
        }
        return clean(arr[1]) === window._latestMonth;
    }

    /* ── 重置：恢复默认排序为 ADO 降序 ────────────────────────── */
    function clearFilters() {
        document.getElementById('searchInput').value = '';
        ['l1Filter', 'l2Filter', 'l3Filter', 'siteFilter'].forEach(id => document.getElementById(id).value = '');
        document.getElementById('sortOrder').value = 'adoDesc';  // 重置回默认排序
        document.getElementById('topNewFilter').checked = false;
        window._latestMonth = null;
        updateL2();
        applyFilters();
    }

    let timer;
    const debouncedFilter = () => { clearTimeout(timer); timer = setTimeout(applyFilters, 300); };

    window.onload = loadData;
</script>
</body>
</html>
