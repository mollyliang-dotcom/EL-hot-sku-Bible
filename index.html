<style>
:root {
--primary: #EE4D2D;
--primary-light: #fff5f2;
--primary-dark: #d73211;
--bg: #faf8f9;
--card-bg: #ffffff;
--text: #2d2038;
--text-muted: #9b8fa0;
--border: #f0e8ed;
--success: #27ae60;
--info: #2980b9;
--tag-bg: #fff3f7;
--danger: #eb4d4b;
--shadow: 0 2px 16px rgba(238,77,45,0.07);
--shadow-hover: 0 8px 32px rgba(238,77,45,0.16);
--radius: 16px;
--radius-sm: 8px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
header {
background: linear-gradient(135deg, #FF6633 0%, #EE4D2D 50%, #D02D11 100%);
color: white; padding: 36px 40px 28px; position: relative; overflow: hidden;
}
header::before {
content: ''; position: absolute; top: -60px; right: -60px;
width: 280px; height: 280px; background: rgba(255,255,255,0.08); border-radius: 50%;
}
.header-inner { max-width: 1280px; margin: 0 auto; position: relative; z-index: 1; }
header h1 { font-family: Georgia, 'Times New Roman', serif; font-size: 32px; display: flex; align-items: center; gap: 12px; }
header h1 .badge {
background: rgba(255,255,255,0.25); font-family: inherit;
font-size: 11px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase;
padding: 4px 10px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.3);
}
.header-desc {
margin-top: 14px; background: rgba(0,0,0,0.1); padding: 12px 16px;
border-radius: var(--radius-sm); font-size: 13px; line-height: 1.8;
max-width: 700px; border-left: 3px solid rgba(255,255,255,0.7);
}
.last-update-tag {
position: absolute; top: 20px; right: 40px; background: rgba(255,255,255,0.15);
padding: 6px 12px; border-radius: 30px; font-size: 12px;
backdrop-filter: blur(5px); border: 1px solid rgba(255,255,255,0.2);
}
.container { max-width: 1280px; margin: 0 auto; padding: 28px 24px; }
.filter-section {
background: var(--card-bg); padding: 20px 24px; border-radius: var(--radius);
margin-bottom: 24px; box-shadow: var(--shadow); border: 1px solid var(--border);
}
.filter-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.filter-row + .filter-row { margin-top: 12px; }
.filter-label { font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; white-space: nowrap; }
input[type="text"], select {
padding: 9px 14px; border: 1.5px solid var(--border); border-radius: var(--radius-sm);
font-family: inherit; font-size: 13px; color: var(--text);
background: var(--bg); transition: border-color 0.2s, box-shadow 0.2s; outline: none;
}
input[type="text"]:focus, select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-light); }
select#sortOrder { border-color: var(--primary); color: var(--primary-dark); font-weight: 600; }
.switch-container {
display: flex; align-items: center; gap: 8px; background: var(--bg); padding: 6px 12px;
border-radius: var(--radius-sm); border: 1.5px solid var(--border); cursor: pointer;
}
.count-badge { margin-left: auto; background: var(--primary-light); color: var(--primary-dark); font-weight: 700; font-size: 13px; padding: 6px 14px; border-radius: 20px; }
.btn-clear { padding: 9px 16px; background: transparent; border: 1.5px solid var(--border); border-radius: var(--radius-sm); color: var(--text-muted); font-family: inherit; font-size: 13px; cursor: pointer; transition: all 0.2s; }
.btn-clear:hover { border-color: var(--primary); color: var(--primary); }
.loading-state { grid-column: 1 / -1; text-align: center; padding: 60px 20px; color: var(--text-muted); }
.loading-spinner { width: 36px; height: 36px; border: 3px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
@keyframes spin { to { transform: rotate(360deg); } }
.product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 20px; }
.card {
background: var(--card-bg); border-radius: var(--radius); overflow: hidden;
border: 1px solid var(--border); transition: transform 0.25s ease, box-shadow 0.25s ease;
position: relative; display: flex; flex-direction: column;
}
.card:hover { transform: translateY(-4px); box-shadow: var(--shadow-hover); border-color: #ffd6cc; }
.site-tag {
position: absolute; top: 10px; left: 10px;
background: var(--primary); color: white;
padding: 3px 9px 3px 5px; border-radius: 20px; z-index: 10;
display: flex; align-items: center; gap: 5px;
}
.site-tag img.flag-img {
width: 18px; height: 13px; border-radius: 2px;
object-fit: cover; display: block; flex-shrink: 0;
}
.site-tag .code { font-size: 11px; font-weight: 700; letter-spacing: 0.5px; line-height: 1; }
.new-badge {
position: absolute; top: 10px; right: 10px;
background: #F4A855; color: white;
font-size: 10px; font-weight: 700; padding: 3px 8px;
border-radius: 20px; z-index: 10; letter-spacing: 0.5px;
}
.img-container {
width: 100%; height: 220px; background: #fffafa; overflow: hidden;
border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: center; cursor: zoom-in;
}
.img-container img { max-width: 100%; max-height: 100%; object-fit: contain; }
.info { padding: 14px 16px; flex-grow: 1; display: flex; flex-direction: column; gap: 8px; }
.item-title { font-weight: 600; font-size: 14px; line-height: 1.45; height: 40px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; color: var(--text); }
.price-row { display: flex; align-items: baseline; gap: 6px; }
.price-label { font-size: 11px; color: var(--text-muted); font-weight: 500; }
.price-value { color: var(--primary); font-size: 18px; font-weight: 700; }
.meta-row { display: flex; flex-wrap: wrap; gap: 5px; }
.pill { font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 20px; border: 1px solid transparent; }
.pill-cat { background: var(--tag-bg); color: var(--primary-dark); border-color: #f5c5d2; }
.ado-block { display: flex; align-items: center; gap: 8px; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 6px 10px; }
.ado-label { font-size: 10px; color: var(--text-muted); font-weight: 600; white-space: nowrap; }
.ado-range { font-size: 12px; font-weight: 700; white-space: nowrap; }
.ado-range.pos { color: var(--success); }
.ado-range.neg { color: var(--danger); }
.ado-range.zero { color: var(--text-muted); }
.sparkline-wrap { flex: 1; display: flex; align-items: center; justify-content: flex-end; }
.stats-row { display: flex; gap: 8px; }
.stat-box { flex: 1; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 6px 10px; text-align: center; }
.stat-label { font-size: 10px; color: var(--text-muted); font-weight: 600; margin-bottom: 2px; }
.stat-value { font-size: 12px; font-weight: 700; white-space: nowrap; }
.stat-value.ado-val { color: var(--success); }
.stat-value.adg-val { color: var(--info); }
.footer-row { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border); padding-top: 10px; margin-top: auto; font-size: 11px; color: var(--text-muted); }
.itemid-box { font-family: monospace; background: var(--bg); padding: 2px 7px; border-radius: 4px; border: 1px dashed #ddd; cursor: pointer; }
#imageModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 9999; justify-content: center; align-items: center; cursor: zoom-out; }
#imageModal img { max-width: 90vw; max-height: 90vh; border-radius: 8px; }
#toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(20px); background: #333; color: white; padding: 10px 22px; border-radius: 30px; font-size: 13px; opacity: 0; transition: all 0.3s; z-index: 10000; }
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.pagination { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 32px 0; }
.pagination button { padding: 8px 16px; border: 1.5px solid var(--border); background: white; cursor: pointer; border-radius: var(--radius-sm); font-family: inherit; transition: all 0.2s; }
.pagination button:hover:not(:disabled) { border-color: var(--primary); color: var(--primary); }
.pagination button:disabled { opacity: 0.4; cursor: not-allowed; }
footer { text-align: center; color: var(--text-muted); font-size: 11px; padding: 40px; border-top: 1px solid var(--border); }
</style>
</head>
<body>
<header>
<div class="header-inner">
<h1>Shopee EL 选品指南 <span class="badge">External</span></h1>
<div class="header-desc">
✨ <strong>精选热销品新品</strong> · 涵盖多站点，帮你快速锁定爆款选品<br>
📊 ADO 与 ADG 采用区间脱敏展示，价格以 USD 原价展示<br>
🔒 提示：当前页面仅供内部选品参考，不提供外部商品跳转链接。
</div>
<div class="last-update-tag" id="lastUpdateDisplay">数据更新中...</div>
</div>
</header>
<div class="container">
<div class="filter-section">
<div class="filter-row">
<span class="filter-label">🔍</span>
<input type="text" id="searchInput" placeholder="搜索标题 / ID..." oninput="debouncedFilter()">
<select id="l1Filter" onchange="updateL2(); applyFilters()"><option value="">L1 类目</option></select>
<select id="l2Filter" onchange="updateL3(); applyFilters()"><option value="">L2 类目</option></select>
<select id="l3Filter" onchange="applyFilters()"><option value="">L3 类目</option></select>
<span class="filter-label">📊 排序</span>
<select id="sortOrder" onchange="applyFilters()">
<option value="adoDesc" selected>单量 (ADO) ↓</option>
<option value="adgDesc">销售额 (ADG) ↓</option>
<option value="priceDesc">价格 ↓</option>
<option value="momDesc">ADO MoM ↓ (增长最快)</option>
<option value="momAsc">ADO MoM ↑ (跌幅最大)</option>
</select>
<button class="btn-clear" onclick="clearFilters()">✕ 重置</button>
<span class="count-badge" id="countDisplay">—</span>
</div>
<div class="filter-row">
<span class="filter-label">🌏 站点</span>
<select id="siteFilter" onchange="applyFilters()">
<option value="">全部站点</option>
<option value="BR">BR</option>
<option value="MX">MX</option>
<option value="MY">MY</option>
<option value="PH">PH</option>
<option value="SG">SG</option>
<option value="TH">TH</option>
<option value="TW">TW</option>
<option value="VN">VN</option>
</select>
<span class="filter-label">📈 ADO MoM</span>
<select id="momFilter" onchange="applyFilters()">
<option value="">全部趋势</option>
<option value="pos">▲ 正增长</option>
<option value="neg">▼ 负增长</option>
<option value="zero">– 持平</option>
</select>
<label class="switch-container">
<input type="checkbox" id="topNewFilter" onchange="applyFilters()">
<span style="font-size:13px;font-weight:500;">🔥 Top New SKU <small style="font-weight:400;color:var(--text-muted);">(近30天上新)</small></span>
</label>
</div>
</div>
<div class="product-grid" id="productGrid">
<div class="loading-state"><div class="loading-spinner"></div><div>数据加载中，请稍候...</div></div>
</div>
<div class="pagination" id="pagination"></div>
</div>
<div id="imageModal" onclick="this.style.display='none'"><img id="modalImg" src=""></div>
<div id="toast"></div>
<footer>Shopee EL 选品指南</footer>
<script>
const DATA_URL = './data.json';
let products = [], filteredData = [], currentPage = 1;
const pageSize = 40;
function getFlagImgHtml(countryCode) {
if (!countryCode || countryCode.length !== 2) return '';
const code = countryCode.toLowerCase();
return '<img class="flag-img" src="https://flagcdn.com/w40/' + code + '.png" alt="' + countryCode + '" onerror="this.style.display=\'none\'">';
}
function showToast(msg) {
const t = document.getElementById('toast');
t.textContent = msg; t.classList.add('show');
setTimeout(function() { t.classList.remove('show'); }, 2000);
}
const clean = function(s) { return (s || '').toString().replace(/[\t"]/g, '').trim(); };
const toNum = function(s) {
const str = clean(s).replace(/,/g, '').replace(/%/g, '');
return parseFloat(str) || 0;
};
const KNOWN_SITES = ['BR','MX','MY','PH','SG','TH','TW','VN'];
function normalizeSite(raw) {
const s = clean(raw).toUpperCase();
for (let i = 0; i < KNOWN_SITES.length; i++) { if (s === KNOWN_SITES[i]) return KNOWN_SITES[i]; }
for (let i = 0; i < KNOWN_SITES.length; i++) { if (s.indexOf(KNOWN_SITES[i]) !== -1) return KNOWN_SITES[i]; }
return s;
}
function normalizeItem(obj) {
return {
itemid:      clean(obj.item_id || ''),
year_month:  clean(obj.year_month || ''),
site:        normalizeSite(obj.grass_region || ''),
title:       clean(obj.item_name || ''),
l1:          clean(obj.cb_level1_global_be_category || ''),
l2:          clean(obj.level2_global_be_category || ''),
l3:          clean(obj.level3_global_be_category || ''),
create_date: clean(obj.item_create_date || ''),
imgUrl:      clean(obj.product_image || ''),
price_usd:   toNum(obj.price_usd || 0),
ado:         toNum(obj['ADO(SUM)'] || 0),
ado_mom:     toNum(obj['mom_ado_growth_contri(SUM)'] || 0),
adg_usd:     toNum(obj['ADG_usd(SUM)'] || 0)
};
}
function toRangeStr(val, step) {
const n = parseFloat(val); if (isNaN(n)) return null;
if (n >= 0) { const lo = Math.floor(n/step)*step; return lo + '~' + (lo+step); }
else { const hi = Math.ceil(n/step)*step; return (hi-step) + '~' + hi; }
}
function adoRange(v) {
const n = parseFloat(v); if (isNaN(n) || n === 0) return null;
let step = n < 100 ? 10 : n < 1000 ? 50 : 100;
return toRangeStr(n, step);
}
function adgRange(v) {
const n = parseFloat(v); if (isNaN(n) || n === 0) return null;
let step = n < 100 ? 10 : n < 500 ? 50 : n < 2000 ? 100 : n < 10000 ? 500 : 1000;
return toRangeStr(n, step);
}
function buildSparkline(momVal) {
if (isNaN(momVal) || momVal === null) return '';
const isPos = momVal > 0, isZero = momVal === 0;
const color = isZero ? '#9b8fa0' : (isPos ? '#27ae60' : '#eb4d4b');
const fill  = isZero ? 'rgba(155,143,160,0.08)' : (isPos ? 'rgba(39,174,96,0.10)' : 'rgba(235,77,75,0.10)');
const W = 64, H = 28, mid = 0.5;
const amp  = Math.min(0.45, Math.max(0.05, Math.abs(momVal) / 50 * 0.3));
const endY = isZero ? mid : (isPos ? mid - amp : mid + amp);
const ys   = [mid, mid+(endY-mid)*0.1, mid+(endY-mid)*0.35, mid+(endY-mid)*0.7, endY];
const coords = ys.map(function(y,i) { return { x: +((i*W/(ys.length-1)).toFixed(1)), y: +(y*H).toFixed(1) }; });
let d = 'M' + coords[0].x + ',' + coords[0].y;
for (let i = 1; i < coords.length; i++) {
const cx = (coords[i-1].x + coords[i].x) / 2;
d += ' C' + cx + ',' + coords[i-1].y + ' ' + cx + ',' + coords[i].y + ' ' + coords[i].x + ',' + coords[i].y;
}
const last = coords[coords.length-1];
const fillD = d + ' L' + last.x + ',' + H + ' L' + coords[0].x + ',' + H + ' Z';
return '<svg width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '" xmlns="http://www.w3.org/2000/svg">'
+ '<path d="' + fillD + '" fill="' + fill + '" stroke="none"/>'
+ '<path d="' + d + '" fill="none" stroke="' + color + '" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>'
+ '<circle cx="' + last.x + '" cy="' + last.y + '" r="2.2" fill="' + color + '"/>'
+ '</svg>';
}
function sortData(data, key) {
const s = data.slice();
if (key === 'adoDesc')   s.sort(function(a,b) { return b.ado - a.ado; });
if (key === 'adgDesc')   s.sort(function(a,b) { return b.adg_usd - a.adg_usd; });
if (key === 'priceDesc') s.sort(function(a,b) { return b.price_usd - a.price_usd; });
if (key === 'momDesc')   s.sort(function(a,b) { return b.ado_mom - a.ado_mom; });
if (key === 'momAsc')    s.sort(function(a,b) { return a.ado_mom - b.ado_mom; });
return s;
}
async function loadData() {
try {
const res = await fetch(DATA_URL + '?t=' + Date.now());
if (!res.ok) throw new Error('HTTP ' + res.status);
const json = await res.json();
const rawList = Array.isArray(json) ? json : (json.data || []);
if (!rawList.length) throw new Error('数据为空');
products = rawList.map(normalizeItem).filter(function(p) { return p.itemid; });
const dates = products.map(function(p) { return new Date(p.create_date); }).filter(function(d) { return !isNaN(d); });
if (dates.length) {
document.getElementById('lastUpdateDisplay').textContent =
'数据最后更新: ' + new Date(Math.max.apply(null, dates)).toLocaleDateString('zh-CN');
}
initFilters(); applyFilters();
} catch(e) {
document.getElementById('productGrid').innerHTML =
'<div class="loading-state">数据加载失败：' + e.message + '</div>';
}
}
function initFilters() {
const l1s = []; const seen = {};
products.forEach(function(p) { const v = p.l1; if (v && !seen[v]) { seen[v] = 1; l1s.push(v); } });
l1s.sort();
const el = document.getElementById('l1Filter');
el.innerHTML = '<option value="">L1 类目</option>';
l1s.forEach(function(v) { el.innerHTML += '<option value="' + v + '">' + v + '</option>'; });
updateL2();
}
function updateL2() {
const l1 = document.getElementById('l1Filter').value;
const el = document.getElementById('l2Filter');
el.innerHTML = '<option value="">L2 类目</option>';
const seen = {}, vals = [];
products.filter(function(p) { return !l1 || p.l1 === l1; })
.forEach(function(p) { const v = p.l2; if (v && !seen[v]) { seen[v] = 1; vals.push(v); } });
vals.sort().forEach(function(v) { el.innerHTML += '<option value="' + v + '">' + v + '</option>'; });
updateL3();
}
function updateL3() {
const l1 = document.getElementById('l1Filter').value;
const l2 = document.getElementById('l2Filter').value;
const el = document.getElementById('l3Filter');
el.innerHTML = '<option value="">L3 类目</option>';
const seen = {}, vals = [];
products.filter(function(p) { return (!l1 || p.l1 === l1) && (!l2 || p.l2 === l2); })
.forEach(function(p) { const v = p.l3; if (v && !seen[v]) { seen[v] = 1; vals.push(v); } });
vals.sort().forEach(function(v) { el.innerHTML += '<option value="' + v + '">' + v + '</option>'; });
}
function isNewSku(p) {
const dateStr = p.create_date;
if (!dateStr) return false;
const createTime = new Date(dateStr).getTime();
if (isNaN(createTime)) return false;
if (!window._todayMs) {
const t = new Date(); t.setHours(0,0,0,0);
window._todayMs = t.getTime();
}
const diffDays = (window._todayMs - createTime) / 86400000;
return diffDays >= 0 && diffDays <= 30;
}
function render(dataList, page) {
page = page || 1;
currentPage = page;
const grid = document.getElementById('productGrid');
grid.innerHTML = '';
const pageData = dataList.slice((page-1)*pageSize, page*pageSize);
if (!pageData.length) {
grid.innerHTML = '<div class="loading-state">没有找到符合条件的商品</div>';
renderPagination(0); return;
}
pageData.forEach(function(item) {
const flagHtml    = getFlagImgHtml(item.site);
const siteTagHtml = flagHtml + '<span class="code">' + item.site + '</span>';
const newBadge    = isNewSku(item) ? '<div class="new-badge">NEW</div>' : '';
const priceDisplay = item.price_usd ? '$' + item.price_usd.toFixed(2) : '—';
const adoRangeStr  = adoRange(item.ado);
const adgRangeStr  = adgRange(item.adg_usd);
const momVal   = item.ado_mom;
const adoClass = momVal > 0 ? 'pos' : momVal < 0 ? 'neg' : 'zero';
const adoIcon  = momVal > 0 ? '▲' : momVal < 0 ? '▼' : '–';
const momDisplay = (momVal > 0 ? '+' : '') + momVal.toFixed(1) + '%';
const sparkSvg   = buildSparkline(momVal);
const adoBlock = adoRangeStr ? (
'<div class="ado-block">'
+ '<span class="ado-label">ADO MoM</span>'
+ '<span class="ado-range ' + adoClass + '">' + adoIcon + ' ' + momDisplay + '</span>'
+ '<div class="sparkline-wrap">' + sparkSvg + '</div>'
+ '</div>'
) : '';
const l3Html = item.l3 ? '<span class="pill pill-cat">' + item.l3 + '</span>' : '';
const card = document.createElement('div');
card.className = 'card';
card.innerHTML =
'<div class="site-tag">' + siteTagHtml + '</div>'
+ newBadge
+ '<div class="img-container" onclick="openModal(\'' + item.imgUrl + '\')">'
+   '<img src="' + item.imgUrl + '" loading="lazy" onerror="this.style.display=\'none\';this.parentNode.innerHTML+=\'<div style=&quot;font-size:40px;color:#ddd&quot;>📦</div>\'">'
+ '</div>'
+ '<div class="info">'
+   '<div class="item-title" title="' + item.title + '">' + item.title + '</div>'
+   '<div class="price-row"><span class="price-label">价格</span><span class="price-value">' + priceDisplay + '</span></div>'
+   (l3Html ? '<div class="meta-row">' + l3Html + '</div>' : '')
+   adoBlock
+   '<div class="stats-row">'
+     '<div class="stat-box"><div class="stat-label">ADO (件/日)</div><div class="stat-value ado-val">' + (adoRangeStr || '—') + '</div></div>'
+     '<div class="stat-box"><div class="stat-label">ADG (USD/日)</div><div class="stat-value adg-val">' + (adgRangeStr ? '$' + adgRangeStr : '—') + '</div></div>'
+   '</div>'
+   '<div class="footer-row">'
+     '<span>📅 ' + (item.create_date || item.year_month) + '</span>'
+     '<span class="itemid-box" onclick="copyId(\'' + item.itemid + '\')">ID: ' + item.itemid + '</span>'
+   '</div>'
+ '</div>';
grid.appendChild(card);
});
renderPagination(dataList.length);
}
function openModal(src) { document.getElementById('modalImg').src = src; document.getElementById('imageModal').style.display = 'flex'; }
function copyId(id) { navigator.clipboard.writeText(id).then(function() { showToast('已复制 ID: ' + id); }); }
function renderPagination(total) {
const tp = Math.ceil(total/pageSize) || 1;
document.getElementById('pagination').innerHTML =
'<button onclick="changePage(-1)" ' + (currentPage===1?'disabled':'') + '>←</button>'
+ '<span style="font-size:13px;color:var(--text-muted)">' + currentPage + ' / ' + tp + '</span>'
+ '<button onclick="changePage(1)" ' + (currentPage>=tp?'disabled':'') + '>→</button>';
}
function changePage(d) { render(filteredData, currentPage+d); window.scrollTo(0,0); }
function applyFilters() {
const q        = document.getElementById('searchInput').value.toLowerCase();
const l1       = document.getElementById('l1Filter').value;
const l2       = document.getElementById('l2Filter').value;
const l3       = document.getElementById('l3Filter').value;
const site     = document.getElementById('siteFilter').value;
const isTopNew = document.getElementById('topNewFilter').checked;
const sort     = document.getElementById('sortOrder').value;
const mom      = document.getElementById('momFilter').value;
const filtered = products.filter(function(p) {
return (!q       || p.title.toLowerCase().indexOf(q) !== -1 || p.itemid.indexOf(q) !== -1) &&
(!l1      || p.l1 === l1) &&
(!l2      || p.l2 === l2) &&
(!l3      || p.l3 === l3) &&
(!site    || p.site === site) &&
(!isTopNew || isNewSku(p)) &&
(!mom ||
(mom === 'pos'  && p.ado_mom > 0) ||
(mom === 'neg'  && p.ado_mom < 0) ||
(mom === 'zero' && p.ado_mom === 0)
);
});
filteredData = sortData(filtered, sort);
document.getElementById('countDisplay').textContent = '共 ' + filteredData.length + ' 款';
render(filteredData, 1);
}
function clearFilters() {
document.getElementById('searchInput').value = '';
['l1Filter','l2Filter','l3Filter','siteFilter','momFilter'].forEach(function(id) {
document.getElementById(id).value = '';
});
document.getElementById('sortOrder').value = 'adoDesc';
document.getElementById('topNewFilter').checked = false;
window._todayMs = null;
updateL2(); applyFilters();
}
let timer;
function debouncedFilter() { clearTimeout(timer); timer = setTimeout(applyFilters, 300); }
window.onload = loadData;
</script>
